    // from mechanic, the bodyweight ceiling, calibration seeding a fresh exercise — just works.
    dayObj.exercises = (dayObj.exercises || []).concat([{
      id: "cx" + Date.now().toString(36),
      name: pool.name, weight: pool.bodyweight ? null : (startWeight != null ? startWeight : null),
      bodyweight: pool.bodyweight || false, isFailure: pool.isFailure || false,
      sets: 3,
      repLow: pool.bodyweight ? null : bandForMechanic(pool.mechanic).repLow,
      repHigh: pool.bodyweight ? null : bandForMechanic(pool.mechanic).repHigh,
      mechanic: pool.mechanic, bwPct: pool.bwPct != null ? pool.bwPct : null,
      unilateral: !!pool.unilateral,
      muscle: consolidateMuscleGroup(pool.muscle),
    }]);
    customCompositionChange(next, "Added " + pool.name);
  }
  function removeCustomExercise(dayKey, exerciseId, exerciseName) {
    if (!data.customProgramConfig) return;
    const next = JSON.parse(JSON.stringify(data.customProgramConfig));
    const dayObj = next.exercises[dayKey];
    if (!dayObj) return;
    dayObj.exercises = (dayObj.exercises || []).filter(function (e) { return e.id !== exerciseId; });
    // Features leave, data stays: logs and exercise state are keyed by id and are NOT deleted —
    // they stop rendering. Re-adding the same movement gets a NEW id and a fresh start on
    // purpose: resurrecting months-old targets under an old id would be a worse surprise.
    customCompositionChange(next, "Removed " + exerciseName);
  }

  function toggleRirMode() {
    // While coached, the toggle is a REQUEST — same governance as every other plan change. The
    // target state accounts for a queued enable: tapping while queued asks to cancel, i.e. off.
    if (myCoachRow) {
      const wantOn = !(rirModeEnabled || rirModePendingEnable);
      const payload = isSharedProgram ? { sharedRirMode: wantOn } : { customRirMode: wantOn };
      submitChangeRequest({
        kind: "program_config", program_key: isSharedProgram ? data.activeProgram : "custom",
        effective_week: prog.currentWeek, payload: payload,
        summary: "Turn RIR mode " + (wantOn ? "on" : "off") + (isSharedProgram ? " (shared programs)" : " (custom)"),
      });
      return;
    }
    if (rirModeEnabled) {
      if (isSharedProgram) {
        save(Object.assign({}, data, { sharedRirModeEnabled: false, sharedRirModePendingEnable: false }));
      } else {
        const config = data.customProgramConfig;
        if (!config) return;
        save(Object.assign({}, data, { customProgramConfig: Object.assign({}, config, { rirModeEnabled: false, rirModePendingEnable: false }) }));
      }
      showToast("RIR mode turned off — back to fixed rep ranges");
      return;
    }
    if (rirModePendingEnable) {
      if (isSharedProgram) {
        save(Object.assign({}, data, { sharedRirModePendingEnable: false }));
      } else {
        const config = data.customProgramConfig;
        if (!config) return;
        save(Object.assign({}, data, { customProgramConfig: Object.assign({}, config, { rirModePendingEnable: false }) }));
      }
      showToast("RIR mode enable canceled");
      return;
    }
    // At a PHASE BOUNDARY — phase week 1 with nothing logged this week yet — enabling immediately
    // is exactly as safe as the wizard's direct set: there is no mid-phase RIR history to mix
    // with. The deferral only exists for mid-phase enables, so it only applies to them.
    const phaseWeekNow = computePhaseWeeks(prog.currentWeek, prog.extraDeloadWeeks).length;
    const weekUnlogged = !prog.logs || !prog.logs[prog.currentWeek] || Object.keys(prog.logs[prog.currentWeek]).length === 0;
    const atBoundary = phaseWeekNow === 1 && weekUnlogged;
    if (isSharedProgram) {
      save(Object.assign({}, data, atBoundary
        ? { sharedRirModeEnabled: true, sharedRirModePendingEnable: false }
        : { sharedRirModePendingEnable: true }));
    } else {
      const config = data.customProgramConfig;
      if (!config) return;
      save(Object.assign({}, data, { customProgramConfig: Object.assign({}, config, atBoundary
        ? { rirModeEnabled: true, rirModePendingEnable: false }
        : { rirModePendingEnable: true }) }));
    }
    if (atBoundary) { showToast("RIR mode on — starting with this phase"); return; }
    showToast("RIR mode will turn on at your next deload");
  }

  const groceryKey = "w" + groceryDisplayWeek;
  const groceryChecked = (prog.groceryLogs && prog.groceryLogs[groceryKey]) || {};
  function toggleGrocery(itemName) {
    const cur = Object.assign({}, groceryChecked);
    cur[itemName] = !cur[itemName];
    const newLogs = Object.assign({}, prog.groceryLogs || {});
    newLogs[groceryKey] = cur;
    saveProgram({ groceryLogs: newLogs });
  }
  function resetGroceryList() {
    const newLogs = Object.assign({}, prog.groceryLogs || {});
    newLogs[groceryKey] = {};
    saveProgram({ groceryLogs: newLogs });
  }

  function toggleSkip(exerciseId) {
    const week = prog.currentWeek;
    const weekSkipped = Object.assign({}, prog.skipped[week] || {});
    weekSkipped[exerciseId] = !weekSkipped[exerciseId];
    const newSkipped = Object.assign({}, prog.skipped);
    newSkipped[week] = weekSkipped;
    saveProgram({ skipped: newSkipped });
  }

  function setSwap(exerciseId, name, weight, newRepRange) {
    const cur = effectiveExerciseState[exerciseId];
    const next = Object.assign({}, cur, { nameOverride: name || null });
    if (weight !== null && weight !== "" && !isNaN(Number(weight))) next.weight = Number(weight);
    if (newRepRange) {
      next.repLowOverride = newRepRange.repLow;
      next.repHighOverride = newRepRange.repHigh;
      next.repsTarget = newRepRange.repLow;
    }
    const newState = Object.assign({}, effectiveExerciseState);
    newState[exerciseId] = next;
    saveExerciseState(newState);
  }

  function clearSwap(exerciseId) {
    const cur = effectiveExerciseState[exerciseId];
    const newState = Object.assign({}, effectiveExerciseState);
    newState[exerciseId] = Object.assign({}, cur, { nameOverride: null });
    saveExerciseState(newState);
  }

  // "This week only" substitution — deliberately separate from setSwap/clearSwap above. Logged sets
  // for the substitute go under a derived altId, not the original exercise's own id, so switching
  // back next week (which just has no entry here) leaves the original's history completely
  // untouched the whole time, rather than needing to be restored.
  function setWeekSwap(exerciseId, name, weight, repLow, repHigh, bodyweight, fallbackWeight, fallbackRepLow, fallbackRepHigh) {
    const week = prog.currentWeek;
    const weekOverrides = Object.assign({}, prog.exerciseWeekOverrides);
    const thisWeek = Object.assign({}, weekOverrides[week]);
    const finalWeight = (weight !== null && weight !== "" && !isNaN(Number(weight))) ? Number(weight) : fallbackWeight;
    // A blank name means "just changing the weight/reps, not renaming this exercise" — e.g. logging
    // what a differently-loaded machine actually took. Leaving it null lets effectiveExercises fall
    // back to the original exercise's own name, rather than mislabeling it a generic "Substitute
    // Exercise" the way any blank name used to.
    thisWeek[exerciseId] = {
      altId: exerciseId + "_alt", name: name || null, weight: finalWeight,
      repLow: repLow != null ? repLow : fallbackRepLow, repHigh: repHigh != null ? repHigh : fallbackRepHigh, bodyweight: !!bodyweight,
    };
    if (myCoachRow) {
      const reqPayload = {}; reqPayload[exerciseId] = thisWeek[exerciseId];
      submitChangeRequest({
        kind: "exercise_week", program_key: data.activeProgram, effective_week: week,
        payload: reqPayload,
        summary: "This week: " + (name || "same exercise") + " @ " + finalWeight + "lb" +
          (repLow != null ? ", " + repLow + "\u2013" + repHigh + " reps" : ""),
      });
      return;
    }
    weekOverrides[week] = thisWeek;
    saveProgram({ exerciseWeekOverrides: weekOverrides });
  }
  function clearWeekSwap(exerciseId) {
    const week = prog.currentWeek;
    const weekOverrides = Object.assign({}, prog.exerciseWeekOverrides);
    const thisWeek = Object.assign({}, weekOverrides[week]);
    delete thisWeek[exerciseId];
    weekOverrides[week] = thisWeek;
    saveProgram({ exerciseWeekOverrides: weekOverrides });
  }

  // Resets ONE exercise's shared progression (weight/rep target/any swap) back to the program's
  // own starting point — for when someone wants a fresh baseline on a movement rather than
  // continuing wherever Cutting/Cruise/Hypertrophy last left it (they share this state; see
  // sharedExerciseState's definition). Deliberately only clears the progression pointer, not any
  // actual logged sets — those remain in each program's own history exactly as before.
  function clearExerciseHistory(exerciseId) {
    const newState = Object.assign({}, effectiveExerciseState);
    delete newState[exerciseId];
    saveExerciseState(newState);
    showToast("Cleared — this exercise starts fresh from here");
  }
  // Corrects an exercise's muscle-group tag (for a mis-tagged built-in exercise, or one swapped in
  // permanently that doesn't match the slot's default) without touching the exercise's own hardcoded
  // definition — same override pattern as everything else in exerciseState. Feeds directly into the
  // volume-increase evaluation's muscle-group grouping the next time it runs.
  function setMuscleOverride(exerciseId, muscle) {
    const cur = effectiveExerciseState[exerciseId] || {};
    const newState = Object.assign({}, effectiveExerciseState);
    newState[exerciseId] = Object.assign({}, cur, { muscleOverride: muscle });
    saveExerciseState(newState);
  }
  function updateExerciseNote(exerciseId, text) {
    const cur = effectiveExerciseState[exerciseId] || {};
    const newState = Object.assign({}, effectiveExerciseState);
    newState[exerciseId] = Object.assign({}, cur, { notes: text });
    saveExerciseState(newState);
  }

  function createSuperset(day, exerciseIds) {
    const cur = prog.supersetGroups[day] || [];
    const newGroups = Object.assign({}, prog.supersetGroups);
    newGroups[day] = cur.concat([exerciseIds]);
    saveProgram({ supersetGroups: newGroups });
  }
  function removeSuperset(day, groupIndex) {
    const cur = prog.supersetGroups[day] || [];
    const newGroups = Object.assign({}, prog.supersetGroups);
    newGroups[day] = cur.filter(function (_, i) { return i !== groupIndex; });
    saveProgram({ supersetGroups: newGroups });
  }

  function toggleLikedFood(mealKey, name) {
    const byMeal = data.likedFoodsByMeal || { m1: [], m2: [], m3: [], m4: [] };
    const cur = byMeal[mealKey] || [];
    const next = cur.indexOf(name) !== -1 ? cur.filter(function (n) { return n !== name; }) : cur.concat([name]);
    save(Object.assign({}, data, { likedFoodsByMeal: Object.assign({}, byMeal, { [mealKey]: next }) }));
  }
  // Copies one meal's liked foods into every OTHER meal slot that's still completely empty — saves
  // re-picking the same foods 3 more times when someone eats similarly across meals, without
  // clobbering a different meal that's already been deliberately customized.
  function copyLikedFoodsToEmptyMeals(sourceMealKey) {
    const byMeal = data.likedFoodsByMeal || { m1: [], m2: [], m3: [], m4: [] };
    const sourceList = byMeal[sourceMealKey] || [];
    if (sourceList.length === 0) return;
    const next = Object.assign({}, byMeal);
    // Derived from the program's real slot count rather than a hardcoded m1–m4, which silently
    // skipped Meal 5+ once meals-per-day became configurable.
    const cfg = data.customProgramConfig;
    const slotCount = cfg && Array.isArray(cfg.slots) && cfg.slots.length ? cfg.slots.length : 4;
    const keys = {};
    for (let i = 1; i <= slotCount; i++) keys["m" + i] = true;
    Object.keys(byMeal).forEach(function (k) { keys[k] = true; });
    Object.keys(keys).forEach(function (k) {
      if (k !== sourceMealKey && (!byMeal[k] || byMeal[k].length === 0)) next[k] = sourceList.slice();
    });
    save(Object.assign({}, data, { likedFoodsByMeal: next }));
  }

  function addCustomFood(name, cat, per100, extra) {
    const filtered = (data.customFoods || []).filter(function (f) { return f.name !== name; });
    const next = filtered.concat([Object.assign({ name: name, cat: cat, cal: per100.cal, p: per100.p, c: per100.c, f: per100.f }, extra || {})]);
    save(Object.assign({}, data, { customFoods: next }));
  }
  function removeCustomFood(name) {
    const next = (data.customFoods || []).filter(function (f) { return f.name !== name; });
    save(Object.assign({}, data, { customFoods: next }));
  }

  function completeCustomSetup(setup) {
    const config = buildWizardConfig(setup, allFoods);
    const newPrograms = Object.assign({}, data.programs, { custom: freshProgramState(setup.exercises) });
    save(Object.assign({}, data, {
      customProgramConfig: config, programs: newPrograms, activeProgram: "custom",
      // Persist the wizard's picks — previously dropped after the solve, leaving later
      // "regenerate" with nothing to draw on.
      likedFoodsByMeal: setup.likedFoodsByMeal || data.likedFoodsByMeal,
    }));
    showToast("Your custom program is ready!");
  }

  function resetCustomSetup() {
    if (!window.confirm("Start the Custom program setup over? This clears its current macros, meal plan, and exercise program — and ALL logged history for it (sets, weigh-ins, nutrition, everything). Your other programs aren't affected. For a small change like your current weight or activity level, use \"Edit Program Settings\" instead — it keeps your history.")) return;
    const newPrograms = Object.assign({}, data.programs, { custom: freshProgramState(EMPTY_CUSTOM_EXERCISES) });
    save(Object.assign({}, data, { customProgramConfig: null, programs: newPrograms }));
  }

  // Applies just ONE regenerated meal to a week — merges into whatever's already overridden there
  // instead of replacing the whole week, so swapping Meal 2's foods doesn't discard a previously
  // applied Meal 1, 3, or 4 for that same week.
  function applySingleMealToWeek(week, mealIdx, r) {
    if (r.error) return;
    const idMap = ["m1", "m2", "m3", "m4"];
    const nameMap = { m1: "Meal 1", m2: "Meal 2", m3: "Meal 3", m4: "Meal 4" };
    const id = idMap[mealIdx];
    const time = (def.slots[mealIdx] && def.slots[mealIdx].time) || nameMap[id];
    const foodStr = r.items.map(function (it) { return formatMealItem(it, allFoods); }).join(" + ");
    const newOverrides = Object.assign({}, prog.customMealOverrides);
    const weekOverride = Object.assign({}, newOverrides[week] || {});
    weekOverride[id] = { id: id, time: time, name: nameMap[id], food: foodStr, cal: Math.round(r.cal), p: Math.round(r.p), c: Math.round(r.c), f: Math.round(r.f), items: r.items };
    newOverrides[week] = weekOverride;
    saveProgram({ customMealOverrides: newOverrides });
    showToast(nameMap[id] + " applied to Week " + week);
  }

  // Regenerates one meal and immediately applies it to whichever week is currently being viewed on
  // the Nutrition tab — no separate "apply to week" step, since the tab already knows which week
  // that is. Avoids repeating a food the other 3 currently-displayed meals are already using, same
  // as the Food Plan tab's version. Scope note: unlike the Food Plan tab's regenerate, this simpler
  // version does not redistribute this meal's macros to the others on failure — it just reports the
  // error inline, since doing the full redistribution here would also need to silently rewrite the
  // other meals' overrides from within a single-meal action, which felt like it deserved its own
  // explicit pass rather than being folded in here by default.
  function regenerateAndApplyMeal(mealIdx) {
    const solverMealsOnly = meals.filter(function (m2) { return m2.id !== "iw"; });
    const avoidNames = [];
    solverMealsOnly.forEach(function (m2, i2) {
      if (i2 !== mealIdx && m2.items) m2.items.forEach(function (it) { avoidNames.push(it.name); });
    });
    const result = regenerateSingleMeal(data.likedFoodsByMeal, allFoods, def.slots, mealIdx, avoidNames);
    if (result.error) {
      showToast(result.error);
      return;
    }
    const mealKey = "m" + (mealIdx + 1);
    const weekOverride = prog.customMealOverrides[nutritionDisplayWeek];
    const previousMeal = (weekOverride && weekOverride[mealKey]) || null; // null means "wasn't overridden" — undo should remove, not restore
    applySingleMealToWeek(nutritionDisplayWeek, mealIdx, result);
    saveProgram({ mealRegenerateUndo: { week: nutritionDisplayWeek, mealId: mealKey, previousMeal: previousMeal } });
  }
  // One-shot undo for the meal regenerate above — mirrors undoCompleteWeek's one-time-only design.
  // If the meal wasn't overridden before regenerating, undoing removes the override entirely
  // (reverting to the base plan) rather than trying to restore a "previous" state that never existed.
  function undoMealRegenerate() {
    const snap = prog.mealRegenerateUndo;
    if (!snap) return;
    const newOverrides = Object.assign({}, prog.customMealOverrides);
    const weekOverride = Object.assign({}, newOverrides[snap.week] || {});
    if (snap.previousMeal) weekOverride[snap.mealId] = snap.previousMeal;
    else delete weekOverride[snap.mealId];
    newOverrides[snap.week] = weekOverride;
    saveProgram({ customMealOverrides: newOverrides, mealRegenerateUndo: null });
    showToast("Undid last regenerate for that meal");
  }

  // "Rebalance my day": boosts one meal by a multiplier (e.g. 1.5x its current size), taking the
  // surplus from the OTHER meals today, proportional to their own size — the inverse of the
  // solver-failure redistribution math (pulling FROM survivors instead of giving TO one that
  // failed). Applies to the actual current calendar day only; the resulting override then persists
  // as real history for that date even after today becomes yesterday, the same way nutrition logs
  // already do — only the action itself is restricted to today, not its ongoing validity once made.
  // All-or-nothing: if any affected meal can't be re-solved at its new target, nothing is applied.
  function rebalanceDayAroundMeal(mealIdx, multiplier) {
    const solverMealsOnly = meals.filter(function (m2) { return m2.id !== "iw"; });
    const boosted = solverMealsOnly[mealIdx];
    if (!boosted) return;
    const surplus = { p: boosted.p * (multiplier - 1), c: boosted.c * (multiplier - 1), f: boosted.f * (multiplier - 1) };
    const otherIdx = [0, 1, 2, 3].filter(function (i) { return i !== mealIdx; });
    const totalP = otherIdx.reduce(function (s, i) { return s + solverMealsOnly[i].p; }, 0);
    const totalC = otherIdx.reduce(function (s, i) { return s + solverMealsOnly[i].c; }, 0);
    const totalF = otherIdx.reduce(function (s, i) { return s + solverMealsOnly[i].f; }, 0);
    const newTargets = {};
    newTargets[mealIdx] = { p: boosted.p + surplus.p, c: boosted.c + surplus.c, f: boosted.f + surplus.f };
    otherIdx.forEach(function (i) {
      const shareP = totalP > 0 ? solverMealsOnly[i].p / totalP : 1 / otherIdx.length;
      const shareC = totalC > 0 ? solverMealsOnly[i].c / totalC : 1 / otherIdx.length;
      const shareF = totalF > 0 ? solverMealsOnly[i].f / totalF : 1 / otherIdx.length;
      newTargets[i] = {
        p: Math.max(0, solverMealsOnly[i].p - surplus.p * shareP),
        c: Math.max(0, solverMealsOnly[i].c - surplus.c * shareC),
        f: Math.max(0, solverMealsOnly[i].f - surplus.f * shareF),
      };
    });
    const idMap = ["m1", "m2", "m3", "m4"];
    const nameMap = { m1: "Meal 1", m2: "Meal 2", m3: "Meal 3", m4: "Meal 4" };
    const results = [];
    let failed = false;
    [0, 1, 2, 3].forEach(function (i) {
      const slot = Object.assign({}, def.slots[i], newTargets[i]);
      const r = generateSingleMealResult(data.likedFoodsByMeal, allFoods, slot, i);
      if (r.error) failed = true;
      results[i] = r;
    });
    if (failed) {
      showToast("Couldn't rebalance — one of today's meals can't hit its new target with your liked foods.");
      return;
    }
    const newDateOverrides = Object.assign({}, prog.mealDateOverrides);
    const todayOverride = Object.assign({}, newDateOverrides[nutritionSelectedDate] || {});
    [0, 1, 2, 3].forEach(function (i) {
      const id = idMap[i];
      const r = results[i];
      const time = (def.slots[i] && def.slots[i].time) || nameMap[id];
      const foodStr = r.items.map(function (it) { return formatMealItem(it, allFoods); }).join(" + ");
      todayOverride[id] = { id: id, time: time, name: nameMap[id], food: foodStr, cal: Math.round(r.cal), p: Math.round(r.p), c: Math.round(r.c), f: Math.round(r.f), items: r.items };
    });
    newDateOverrides[nutritionSelectedDate] = todayOverride;
    saveProgram({ mealDateOverrides: newDateOverrides });
    showToast("Rebalanced today's meals around " + nameMap[idMap[mealIdx]] + ".");
  }

  function revertWeekOverride(week) {
    const newOverrides = Object.assign({}, prog.customMealOverrides);
    delete newOverrides[week];
    saveProgram({ customMealOverrides: newOverrides });
    showToast("Week " + week + " reverted to default meals");
  }

  // Swaps just ONE food (protein, carb, or fat) within a single meal — e.g. "I don't want turkey
  // in Meal 3 this week." Re-solves that meal's macros with the new food substituted in, keeping
  // the other two components the same where possible. Stored as a per-week override, so it applies
  // for the rest of the current week only — the following week reverts to the default plan, since
  // Custom's meal plan is otherwise identical every week by design.
  function swapMealIngredient(mealIndex, role, newFoodName) {
    const newFood = allFoods.filter(function (f) { return f.name === newFoodName; })[0];
    if (!newFood) return;
    // Resolve the macro slot by ID where the meal declares one, falling back to array position.
    //
    // Position only works when meals and slots line up 1:1, which is true for Custom (its plan is
    // generated straight from its slots) but NOT for the built-in programs: those have six entries
    // a day (m1, intra-workout, m2, m3, snack, m4) against four macro slots, so m2 would have been
    // solved against Meal 3's targets, m3 against Meal 4's, and m4 against nothing at all. Every
    // built-in meal converted to structured items carries an explicit `slot`, so the ambiguity
    // simply doesn't arise.
    const currentMeal = meals[mealIndex];
    if (!currentMeal) return;
    // Resolve the macro slot by ID where the meal declares one, falling back to array position.
    //
    // Position only works when meals and slots line up 1:1, which is true for Custom (its plan is
    // generated straight from its slots) but NOT for the built-in programs: those have six entries
    // a day (m1, intra-workout, m2, m3, snack, m4) against four macro slots, so m2 would have been
    // solved against Meal 3's targets, m3 against Meal 4's, and m4 against nothing at all. Every
    // built-in meal converted to structured items carries an explicit `slot`, so the ambiguity
    // simply doesn't arise.
    const slot = currentMeal.slot
      ? def.slots.filter(function (s) { return s.id === currentMeal.slot; })[0]
      : def.slots[mealIndex];
    if (!slot || !currentMeal.items) return; // e.g. the intra-workout entry, which isn't one of the 4 solver slots
    const items = currentMeal.items;
    const roleIdx = { protein: 0, carb: 1, fat: 2 }[role]; // undefined for role "fixed" — handled below
    // role === "fixed" replaces items[3] ITSELF — the slot the solver never touches (a vegetable,
    // or Meal 4's second protein). The replacement keeps the outgoing item's grams; what changes
    // is the residual target the other three are re-solved against, so the meal still lands on
    // its slot's macros to the same tolerance as any other swap.
    const isFixedSwap = role === "fixed";
    if (isFixedSwap && !items[3]) return;
    const vegItem = isFixedSwap ? { name: newFood.name, grams: items[3].grams } : (items[3] || null);
    const vegFood = isFixedSwap ? newFood : (vegItem ? allFoods.filter(function (f) { return f.name === vegItem.name; })[0] : null);
    // items[3] is a FIXED item whose macros come off the target before the other three are solved.
    // It's usually a vegetable, but nothing requires that — Meal 4 uses it for a second protein
    // source (a whey scoop alongside the beef), which is the only way a four-ingredient meal with
    // two proteins fits a three-role solver.
    //
    // This previously subtracted vegFood's raw per-100g macros with no gram scaling. That was
    // silently correct only because every vegetable in every plan happened to be exactly 100g —
    // the moment items[3] holds 33g of whey isolate, it would remove 75.8g of protein from the
    // target instead of 25g and the solve would be badly wrong. The rebalance path already scaled
    // this correctly; the two are now consistent.
    const target = vegFood
      ? [slot.p - (vegFood.p * vegItem.grams) / 100,
         slot.c - (vegFood.c * vegItem.grams) / 100,
         slot.f - (vegFood.f * vegItem.grams) / 100]
      : [slot.p, slot.c, slot.f];

    const currentFoods = [0, 1, 2].map(function (i) { return allFoods.filter(function (f) { return f.name === items[i].name; })[0]; });
    if (roleIdx != null) currentFoods[roleIdx] = newFood;

    let solved = solve3x3(currentFoods, target);
    let usedFoods = currentFoods;

    if (!solved) {
      // Direct substitution didn't solve — search the person's other liked foods for the two
      // roles NOT being swapped, keeping the new food fixed in its role. Same fallback logic
      // already proven in the initial plan generator.
      const mealKey = "m" + (mealIndex + 1);
      const likedForThisMeal = (data.likedFoodsByMeal && data.likedFoodsByMeal[mealKey]) || [];
      const likedObjs = likedForThisMeal.map(function (n) { return allFoods.filter(function (f) { return f.name === n; })[0]; }).filter(Boolean);
      const pool = { protein: likedObjs.filter(function (f) { return f.cat === "protein"; }), carb: likedObjs.filter(function (f) { return f.cat === "carb"; }), fat: likedObjs.filter(function (f) { return f.cat === "fat"; }) };
      const roles = ["protein", "carb", "fat"];
      const options = roles.map(function (r, i) { return i === roleIdx ? [newFood] : pool[r]; });
      outer:
      for (let a = 0; a < options[0].length && !solved; a++) {
        for (let b = 0; b < options[1].length && !solved; b++) {
          for (let c = 0; c < options[2].length && !solved; c++) {
            const attempt = solve3x3([options[0][a], options[1][b], options[2][c]], target);
            if (attempt) { solved = attempt; usedFoods = [options[0][a], options[1][b], options[2][c]]; break outer; }
          }
        }
      }
    }

    if (!solved) {
      showToast("Couldn't fit that food into this meal's targets — try a different one.");
      return;
    }

    const newItems = [
      { name: usedFoods[0].name, grams: solved[0] },
      { name: usedFoods[1].name, grams: solved[1] },
      { name: usedFoods[2].name, grams: solved[2] },
    ];
    if (vegItem) newItems.push(vegItem);
    let cal = 0, p = 0, c = 0, f = 0;
    newItems.forEach(function (it) {
      const food = allFoods.filter(function (f) { return f.name === it.name; })[0];
      cal += (food.cal * it.grams) / 100; p += (food.p * it.grams) / 100; c += (food.c * it.grams) / 100; f += (food.f * it.grams) / 100;
    });
    const foodStr = newItems.map(function (it) { return formatMealItem(it, allFoods); }).join(" + ");
    // `slot` MUST survive into the override: it's both the chevron gate's condition on built-in
    // programs and the mapping to the correct macro targets for any FURTHER swap. Dropping it made
    // the swap's own output ineligible for swapping — the customize section vanished after one use.
    const newMealObj = { id: currentMeal.id, time: currentMeal.time, name: currentMeal.name, slot: currentMeal.slot, food: foodStr, cal: Math.round(cal), p: Math.round(p), c: Math.round(c), f: Math.round(f), items: newItems };

    const currentWeek = prog.currentWeek;
    // While coached, this becomes a REQUEST: the solved meal is the payload, the coach approves,
    // and the verified assignment path applies it. The solver already ran, so what the coach
    // reviews is exactly what the client would have gotten — targets preserved by construction.
    if (myCoachRow) {
      const reqPayload = {}; reqPayload[currentMeal.id] = newMealObj;
      submitChangeRequest({
        kind: "meal_overrides", program_key: data.activeProgram, effective_week: prog.currentWeek,
        payload: reqPayload,
        summary: currentMeal.name + ": swap in " + newFoodName + " \u2192 " + foodStr,
      });
      return;
    }
    const existingWeekOverride = prog.customMealOverrides[currentWeek] || {};
    const newWeekOverride = Object.assign({}, existingWeekOverride, { [currentMeal.id]: newMealObj });
    const newOverrides = Object.assign({}, prog.customMealOverrides, { [currentWeek]: newWeekOverride });
    saveProgram({ customMealOverrides: newOverrides });
    showToast("Swapped — applies for the rest of this week");
  }

  return h("div", { className: "app" },
    updateAvailable && h("div", {
      style: { background: "#8b5cf6", color: "#fff", padding: "10px 16px", textAlign: "center", fontSize: "13px", cursor: "pointer" },
      onClick: function () { window.location.reload(); },

function allSetsHaveReps(logsForEx, setsToday) {
  for (let i = 0; i < setsToday; i++) {
    if (!logsForEx[i] || logsForEx[i].reps == null || logsForEx[i].reps === "") return false;
  }
  return true;
}
function hasAnyLoggedSet(logsForEx) {
  return logsForEx.some(function (s) { return s && s.reps != null && s.reps !== ""; });
}
function isDayFullyComplete(dayExercises, isDeloadWeek, weekLogs, weekSkipped, weekDifficulty, exerciseState) {
  if (dayExercises.length === 0) return true; // rest day — nothing to complete
  return dayExercises.every(function (ex) {
    if (weekSkipped[ex.id]) return true;
    const exState = (exerciseState && exerciseState[ex.id]) || {};
    const sets = effectiveSets(ex, exState);
    const setsToday = isDeloadWeek ? Math.ceil(sets / 2) : sets;
    const logsForEx = weekLogs[ex.id] || [];
    return allSetsHaveReps(logsForEx, setsToday) && !!weekDifficulty[ex.id];
  });
}

// §8b delivery: the weekly digest. Renders once per completed week (seen-set in
// prog.insightDigestSeen) on the training surface where completeWeek happens,
// above the deload/volume banners — those act, this only informs, and finding 1
// deliberately points DOWN at a pending deload banner rather than restating it.
// Tier view follows the domain-crossed rule. HONESTY RULE (backlog + marketing
// #3): a locked teaser renders only when the engine actually found something,
// and it carries evidence COUNTS, never the numbers — calories, rates, and
// percentages are the product, same rule as the locked built-plan teaser.
// Shown whenever computeLapseNudge finds a real gap — no dismiss button, because logging
// something today is what actually makes it go away, not tapping a button that hides it while
// the underlying gap is still true.

// start date: "your coach is away 10-24 August" is more useful known in advance than discovered
// on day one. The window itself still governs the abandonment suspension server-side — this only
// controls when the person is told.
//
// PULL, NOT PUSH. The client sees this the next time they open the app. A coach posting on a
// Friday for a Monday departure reaches someone who does not open the app until Thursday on
// THURSDAY. That is the cost of not depending on the unresolved Worker<->Supabase question that
// blocks every other coach-to-client message (handoff 8b). Do not describe this as notifying.
// The bodyweight ceiling produces four states, and each earns one plain sentence on the exercise

  } else if (st.pendingLadderStep) {

// A minimal dependency-free SVG bar chart — this app deliberately avoids external charting

function BodyCompositionChart(props) {
  const weeks = Object.keys(props.actuals).map(Number).sort(function (a, b) { return a - b; });
  const points = weeks.filter(function (w) {
    const a = props.actuals[w];
    return a && a.weight != null && a.weight !== "" && a.bf != null && a.bf !== "";
  }).map(function (w) {
    const a = props.actuals[w];
    const weight = Number(a.weight), bf = Number(a.bf);
    const fat = Math.round(weight * (bf / 100) * 10) / 10;
    const lean = Math.round((weight - fat) * 10) / 10;
    return { week: w, fat: fat, lean: lean };
  });
  if (points.length < 2) return null;

  function normalize(values) {
    const min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    const range = max - min || 1;
    return values.map(function (v) { return (v - min) / range; });
  }
  const leanNorm = normalize(points.map(function (p) { return p.lean; }));
  const fatNorm = normalize(points.map(function (p) { return p.fat; }));

  const spacing = 46, chartHeight = 100, topPad = 16, sidePad = 16, bottomPad = 18;
  const width = Math.max((points.length - 1) * spacing, 1) + sidePad * 2;
  const leanColor = "#3d97d3", fatColor = "#f0b429";

  function coordsFor(normValues, rawValues) {
    return points.map(function (p, i) {
      const x = i * spacing + sidePad;
      const y = topPad + (chartHeight - normValues[i] * chartHeight);
      return { x: x, y: y, value: rawValues[i], week: p.week };
    });
  }
  const leanCoords = coordsFor(leanNorm, points.map(function (p) { return p.lean; }));
  const fatCoords = coordsFor(fatNorm, points.map(function (p) { return p.fat; }));
  function pathFor(coords) { return coords.map(function (c, i) { return (i === 0 ? "M" : "L") + c.x + "," + c.y; }).join(" "); }

  return h("div", { style: { marginTop: 24 } },
    h("div", { className: "food-cat-title" }, "Lean Mass vs. Fat Mass Trend"),
    h("div", { style: { display: "flex", gap: 16, marginBottom: 8, fontSize: 12 } },
      h("span", { style: { color: leanColor } }, "● Lean Mass"),
      h("span", { style: { color: fatColor } }, "● Fat Mass")
    ),
    h("svg", {
      width: "100%", height: chartHeight + topPad + bottomPad + 10, viewBox: "0 0 " + width + " " + (chartHeight + topPad + bottomPad + 10),
      preserveAspectRatio: "xMinYMin meet",
    },
      h("path", { d: pathFor(leanCoords), fill: "none", stroke: leanColor, strokeWidth: 2, strokeLinejoin: "round", strokeLinecap: "round" }),
      h("path", { d: pathFor(fatCoords), fill: "none", stroke: fatColor, strokeWidth: 2, strokeLinejoin: "round", strokeLinecap: "round" }),
      leanCoords.map(function (c) {
        return h("g", { key: "lean-" + c.week },
          h("circle", { cx: c.x, cy: c.y, r: 3.5, fill: leanColor }),
          h("text", { x: c.x, y: Math.max(c.y - 8, 10), fontSize: 9, fill: leanColor, textAnchor: "middle" }, c.value)
        );
      }),
      fatCoords.map(function (c) {
        return h("g", { key: "fat-" + c.week },
          h("circle", { cx: c.x, cy: c.y, r: 3.5, fill: fatColor }),
          h("text", { x: c.x, y: Math.min(c.y + 15, chartHeight + topPad - 2), fontSize: 9, fill: fatColor, textAnchor: "middle" }, c.value)
        );
      }),
      points.map(function (p, i) {
        return h("text", { key: "wk-" + p.week, x: i * spacing + sidePad, y: chartHeight + topPad + bottomPad, fontSize: 10, fill: "#737373", textAnchor: "middle" }, "Wk " + p.week);
      })
    ),
    h("p", { style: { fontSize: "11px", color: "#525252", marginTop: 4 } },
      "Each line is scaled to its own range so both trends are readable together — labels show the real lb values, only the visual scale is shared.")
  );
}

function ProgressChart(props) {
  const points = props.weeks.map(function (wk) {
    const validSets = wk.sets.filter(function (s) { return s.reps != null; });
    if (props.isBodyweight) {
      const maxReps = validSets.length ? Math.max.apply(null, validSets.map(function (s) { return s.reps || 0; })) : 0;
      return { week: wk.week, value: maxReps };
    }
    const maxWeight = validSets.length ? Math.max.apply(null, validSets.map(function (s) { return s.weight || 0; })) : 0;
    return { week: wk.week, value: maxWeight };
  });
  const maxVal = Math.max.apply(null, points.map(function (p) { return p.value; })) || 1;
  const spacing = 46, chartHeight = 90, topPad = 16, sidePad = 16;
  const width = Math.max((points.length - 1) * spacing, 1) + sidePad * 2;
  const unit = props.isBodyweight ? "" : "lb";

  const coords = points.map(function (p, i) {
    const x = i * spacing + sidePad;
    const y = topPad + (maxVal > 0 ? chartHeight - (p.value / maxVal) * chartHeight : chartHeight);
    return { x: x, y: y, value: p.value, week: p.week };
  });
  const pathD = coords.map(function (c, i) { return (i === 0 ? "M" : "L") + c.x + "," + c.y; }).join(" ");

  return h("div", { style: { marginBottom: 16 } },
    h("div", { style: { fontSize: 11, color: "#737373", marginBottom: 4 } },
      props.isBodyweight ? "Max reps per week (progressive overload)" : "Top weight per week (progressive overload)"),
    h("svg", {
      width: "100%", height: chartHeight + topPad + 26, viewBox: "0 0 " + width + " " + (chartHeight + topPad + 26),
      preserveAspectRatio: "xMinYMin meet",
    },
      h("path", { d: pathD, fill: "none", stroke: props.color, strokeWidth: 2, strokeLinejoin: "round", strokeLinecap: "round" }),
      coords.map(function (c) {
        return h("g", { key: c.week },
          h("circle", { cx: c.x, cy: c.y, r: 4, fill: props.color }),
          h("text", { x: c.x, y: Math.max(c.y - 9, 10), fontSize: 10, fill: "#f5f5f5", textAnchor: "middle" }, c.value + unit),
          h("text", { x: c.x, y: chartHeight + topPad + 18, fontSize: 10, fill: "#737373", textAnchor: "middle" }, "Wk " + c.week)
        );
      })
    )
  );
}

function SetLogger(props) {
  const existing = props.existing;
  const [reps, setReps] = useState(existing && existing.reps != null ? existing.reps : "");
  const [weight, setWeight] = useState(existing && existing.weight != null ? existing.weight : (props.state.weight != null ? props.state.weight : ""));
  const prevDefaultWeight = useRef(props.state.weight);
  // Rest timer fires on blur of the reps field, not on every keystroke (onLog fires per keystroke —
  // typing "12" would otherwise start the timer at "1"). The ref guards against a focus-then-blur
  // with no actual change restarting an in-progress rest period.
  const lastCommittedReps = useRef(existing && existing.reps != null ? String(existing.reps) : "");

  function commitSet() {
    if (reps === "" || String(reps) === lastCommittedReps.current) return;
    lastCommittedReps.current = String(reps);
    if (props.onSetCommitted) props.onSetCommitted();
  }

  useEffect(function () {
    // If the exercise's default weight changed (e.g., after a swap, manual adjustment, or an
    // autoregulation bump/drop triggered by a DIFFERENT set) and this set is still showing the old
    // default rather than a manually-typed override, follow the update — but only while this set
    // hasn't actually been logged yet. Once reps are entered, this set's weight is now historical
    // record of what was actually lifted; letting it keep following the default here is exactly what
    // caused a runaway feedback loop — the set that triggered an autoregulation bump would have its
    // own weight rewritten to the new value, which re-fired onLog with the same (still-overshooting)
    // reps at the new weight, triggering another bump, forever, within milliseconds.
    if (props.state.weight !== prevDefaultWeight.current) {
      if (reps === "" && (weight === "" || Number(weight) === Number(prevDefaultWeight.current))) {
        setWeight(props.state.weight != null ? props.state.weight : "");
      }
      prevDefaultWeight.current = props.state.weight;
    }
  }, [props.state.weight]);

  useEffect(function () {
    if (reps !== "") {
      props.onLog(Number(reps), props.exercise.bodyweight ? null : Number(weight));
    }
  }, [reps, weight]);

  return h("div", { className: "set-row" },
    h("div", { className: "set-row-top" },
      h("span", { className: "set-label" }, "Set " + (props.setIdx + 1)),
      !props.exercise.bodyweight && h("input", {
        type: "number", inputMode: "decimal", value: weight,
        onChange: function (e) { setWeight(e.target.value); }, placeholder: "lb", className: "set-input",
      }),
      h("input", {
        type: "number", inputMode: "numeric", value: reps,
        onChange: function (e) { setReps(e.target.value); }, onBlur: commitSet, placeholder: "reps", className: "set-input",
      }),
      // THE MOST ANCHORING NUMBER ON THE SCREEN — it sits beside the input the person types into,
      // and people work toward whatever goal they are shown. In RIR mode the static rep range is the
      // WRONG goal: targets there are derived from what was actually logged last week, ramped by
      // this week's target RIR, so a lift can legitimately sit well above its printed range.
      // Showing "target 10-15" beside a computed target of 20 taught people to stop five reps early
      // and then recorded it as a miss. Reported by the user 2026-07-30.
      // A single number, not a band: the engine's own definition of a miss is `actual < target`, so
      // a band whose bottom sat below the target would show something as in-range and then score it
      // as a miss. Week 1 has no computed target yet and correctly falls back to the range — that
      // week IS the range-finding exercise, and the calibration banner says so.
      h("span", { className: "set-target" },
        (props.rirModeEnabled && props.state.rirTargetReps != null)
          ? "target " + props.state.rirTargetReps
          : "target " + effectiveRepRange(props.exercise, props.state).repLow + "–" + effectiveRepRange(props.exercise, props.state).repHigh)
    )
  );
}

// Barcodes carry a check digit — the last one is a checksum over the others, so a single mistyped
// or transposed digit is detectable locally without asking the network. Worth doing because the
// manual path is the ONLY path on iPhone (see supportsDetector below), and "no product found" after

        props.onSwap(openRole, e.target.value);
        if (props.likedFoods.indexOf(e.target.value) === -1) props.onAutoLike(e.target.value);
        setOpenRole(null);
      },
    },
      h("option", { value: "" }, openRole === "fixed" ? "Replace " + (fixedItem ? fixedItem.name : "") + " with..." : "Choose a " + openRole + "..."),
      likedInCat.length > 0 && h("optgroup", { label: "Liked" },
        likedInCat.map(function (f) { return h("option", { key: f.name, value: f.name }, f.name); })
      ),
      otherInCat.length > 0 && h("optgroup", { label: openRole === "fixed" ? "All options" : "All " + openRole + "s" },
        otherInCat.map(function (f) { return h("option", { key: f.name, value: f.name }, f.name); })
      )
    )
  );
}

// Shows a simple checklist of supplements tagged to a given timing (a specific meal, or the
// standalone "other" bucket) — same interaction pattern as the meal-status buttons above it.
function SupplementSection(props) {
  const [expanded, setExpanded] = useState(false);
  const supplements = props.supplements || [];
  const allChecked = supplements.length > 0 && supplements.every(function (s) { return !!props.logsToday[s.id]; });
  const prevAllChecked = useRef(allChecked);
  useEffect(function () {
    if (allChecked && !prevAllChecked.current) setExpanded(false); // just completed — collapse
    prevAllChecked.current = allChecked;
  }, [allChecked]);
  if (supplements.length === 0) return null;
  // noCollapse: used when a parent container (e.g. a meal card) already collapses itself once its
  // supplements are done — the checklist just stays a plain sorted list, no second collapse layer.
  if (allChecked && !expanded && !props.noCollapse) {
    return h("div", { style: { marginTop: props.compact ? 8 : 0, marginBottom: props.compact ? 0 : 16 } },
      h("button", {
        className: "ex-action-btn", style: { width: "100%", textAlign: "left" },
        onClick: function () { setExpanded(true); },
      }, "✓ " + (props.title === "Also take" ? "Supplements taken" : props.title + " — done") + " (" + supplements.length + ")")
    );
  }
  // Checked items sink to the bottom while the list is still open, so whatever's left to take
  // stays at the top rather than mixed in with items already handled.
  const ordered = supplements.slice().sort(function (a, b) {
    const aChecked = !!props.logsToday[a.id], bChecked = !!props.logsToday[b.id];
    if (aChecked === bChecked) return 0;
    return aChecked ? 1 : -1;
  });
  return h("div", { style: { marginTop: props.compact ? 8 : 0, marginBottom: props.compact ? 0 : 16 } },
    props.compact
      ? h("div", { style: { fontSize: 11, color: "#737373", marginBottom: 4 } }, props.title + ":")
      : h("div", { className: "food-cat-title" }, props.title),
    ordered.map(function (s) {
      const checked = !!props.logsToday[s.id];
      return h("label", { key: s.id, style: { display: "flex", alignItems: "center", gap: 8, fontSize: 13, padding: "4px 0" } },
        h("input", { type: "checkbox", checked: checked, disabled: props.disabled, onChange: function () { props.toggleLog(s.id); } }),
        h("span", null, s.name)
      );
    })
  );
}

// Lets the person build their own supplement list — deliberately manual entry rather than a
// searchable database, since what matters for supplements is the exact product/label (as the real
// verified protocol this app is built around showed directly), not a generic category lookup the
// way a food database works. Nutrient tagging is optional per supplement; only tagged nutrients
// get checked against NUTRIENT_UL for overlaps.
function SupplementManager(props) {
  const [name, setName] = useState("");
  const [timing, setTiming] = useState("m1");
  const [time, setTime] = useState("");
  const [nutrientRows, setNutrientRows] = useState([{ nutrient: "", amount: "" }]);
  const listOpen = props.uiPrefs.yourSupplementsOpen;
  const boxExpanded = props.uiPrefs.supplementsBoxExpanded;

  function updateRow(i, field, value) {
    const next = nutrientRows.slice();
    next[i] = Object.assign({}, next[i], { [field]: value });
    setNutrientRows(next);
  }
  function removeRow(i) { setNutrientRows(nutrientRows.filter(function (_, idx) { return idx !== i; })); }

  function submit() {
    if (!name.trim()) { window.alert("Enter a supplement name."); return; }
    const nutrients = nutrientRows.filter(function (r) { return r.nutrient && r.amount; }).map(function (r) { return { nutrient: r.nutrient, amount: Number(r.amount) }; });
    props.addSupplement(name.trim(), timing, nutrients, timing === "standalone" ? (time || null) : null);
    setName(""); setTime(""); setNutrientRows([{ nutrient: "", amount: "" }]);
  }

  const TIMING_LABELS = { m1: "With Meal 1", m2: "With Meal 2", m3: "With Meal 3", m4: "With Meal 4", standalone: "Standalone (pre-workout, bedtime, etc.)" };

  return h("div", { className: "panel", style: { marginTop: 16, marginBottom: 16 } },
    h("button", {
      onClick: function () { props.updateUiPrefs({ supplementsBoxExpanded: !boxExpanded }); },
      style: { display: "flex", width: "100%", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", padding: 0, color: "inherit", cursor: "pointer", marginBottom: boxExpanded ? 12 : 0 },
    },
      h("h3", { style: { margin: 0 } }, "Supplements"),
      boxExpanded ? h(ChevronUp, { size: 16 }) : h(ChevronDown, { size: 16 })
    ),
    boxExpanded && h(React.Fragment, null,
      props.supplementList.length > 0 && h("div", { style: { marginBottom: 16 } },
        h("button", {
          className: "ex-action-btn", style: { width: "100%", textAlign: "center", border: "2px solid #3d97d3" },
          onClick: function () { props.updateUiPrefs({ yourSupplementsOpen: !listOpen }); },
        }, "Your Supplements (" + props.supplementList.length + ")"),
        listOpen && props.supplementList.map(function (s) {
          return h("div", { key: s.id, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "1px solid #262626" } },
            h("div", null,
              h("div", { style: { fontSize: 13 } }, s.name),
              h("div", { style: { fontSize: 11, color: "#737373" } },
                (s.timing === "standalone" && s.time ? "Standalone · " + formatTimeHM(s.time) : TIMING_LABELS[s.timing]) +
                (s.nutrients.length ? " · " + s.nutrients.map(function (n) { return (NUTRIENT_UL[n.nutrient] ? NUTRIENT_UL[n.nutrient].label : n.nutrient) + " " + n.amount + (NUTRIENT_UL[n.nutrient] ? NUTRIENT_UL[n.nutrient].unit : ""); }).join(", ") : ""))
            ),
            h("button", { className: "ex-action-btn", style: { flex: "0 0 auto" }, onClick: function () { props.removeSupplement(s.id); } }, "Remove")
          );
        })
      ),
      h("p", { className: "food-cat-title" }, "Add a Supplement"),
      h("input", { className: "search-input", placeholder: "Name (e.g. Vitamin D3 5000IU — Sports Research)", value: name, onChange: function (e) { setName(e.target.value); } }),
      h("select", {
        className: "search-input", style: { marginTop: 8 }, value: timing,
        onChange: function (e) { setTiming(e.target.value); },
      },
        Object.keys(TIMING_LABELS).map(function (k) { return h("option", { key: k, value: k }, TIMING_LABELS[k]); })
      ),
      timing === "standalone" && h("div", { style: { marginTop: 8 } },
        h("p", { style: { fontSize: "11px", color: "#737373", margin: "0 0 4px" } },
          "Optional — give it a time to slot it into the day's plan alongside your meals. Leave blank for as-needed items (they'll show in an Unscheduled section)."),
        h("input", { type: "time", className: "search-input", value: time, onChange: function (e) { setTime(e.target.value); } })
      ),
      h("p", { style: { fontSize: "11px", color: "#737373", marginTop: 8 } },
        "Optional — tag which nutrients this provides, so overlaps with your other supplements can be flagged automatically:"),
      nutrientRows.map(function (row, i) {
        return h("div", { key: i, style: { display: "flex", gap: 6, marginTop: 6 } },
          h("select", {

          ),
          h("input", { type: "number", className: "search-input", placeholder: "Amount", value: row.amount, onChange: function (e) { updateRow(i, "amount", e.target.value); } }),

        );

// Renders one meal card. Food/macro/status buttons are always visible — only the "Also take"
// supplement checklist can be shown/hidden, via a chevron in the header (same placement/style as the
// exercise cards' expand arrow), not a text pill sitting in the body. Once every supplement for this
// meal is checked, the checklist auto-hides completely (no confirmation line left behind); the
// chevron stays as the way back in to double-check or fix a mis-tap. The initial `expanded` value is
// computed directly from the real checked-supplement data at mount time (not a fixed default), so a
// meal that was already complete before a tab switch renders hidden immediately on remount rather
// than needing an effect to catch up.
function MealCard(props) {
  const m = props.meal;
  const status = props.status;
  const supplements = props.supplements || [];
  const hasSupplements = supplements.length > 0;
  // The chevron used to appear only when a meal had supplements attached. It now governs
  // everything secondary on the card — supplements, the ingredient swap, and the food picker —
  // so a meal card at rest shows what you're eating and how much of it you ate, and nothing else.
  // The status buttons (Ate all / ¾ / ½ / Skip) deliberately stay outside it: those are the
  // reason the card exists, and burying the primary action behind a tap would be a bad trade.
  const hasCollapsibleExtras = hasSupplements || !!props.mealSwapControl || !!props.showCustomize;
  const allSuppsChecked = hasSupplements && supplements.every(function (s) { return !!props.logsToday[s.id]; });
  // `!allSuppsChecked` was fine when this collapse only ever held supplements: a meal with none
  // computed allSuppsChecked === false and started expanded, which showed nothing either way. Now
  // that the swap and food-picker controls live in here too, that same default would leave them
  // open on every meal that has no supplements — i.e. most of them — which is exactly what this
  // change is meant to stop. Expanded on load now means one thing only: there are supplements
  // still to take.
  const [expanded, setExpanded] = useState(hasSupplements && !allSuppsChecked);
  const prevAllChecked = useRef(allSuppsChecked);
  useEffect(function () {
    if (allSuppsChecked && !prevAllChecked.current) setExpanded(false); // just finished — hide
    if (!allSuppsChecked && prevAllChecked.current) setExpanded(true); // unchecked something — show again
    prevAllChecked.current = allSuppsChecked;
  }, [allSuppsChecked]);
  const MEAL_CARD_FOOD_CATS = [
    { key: "protein", label: "Proteins (pick at least 1)" }, { key: "carb", label: "Carbs (pick at least 1)" },
    { key: "fat", label: "Fats (pick at least 1)" }, { key: "veg", label: "Vegetables (optional)" },
  ];
  const likedForMeal = props.likedFoodsForMeal || [];
  const [foodFilter, setFoodFilter] = useState("");
  // Each food category (Proteins/Carbs/Fats/Vegetables) starts collapsed — the full list can run
  // long depending on how many foods are in the database, and most of the time someone opening
  // Customize just wants to see what's already liked, not scroll past every option in every
  // category. Force-expanded while actively searching, since a collapsed category would otherwise
  // hide the very results the search was meant to surface.
  const [expandedFoodCats, setExpandedFoodCats] = useState({});
  const [showRebalance, setShowRebalance] = useState(false);
  const customizeExpanded = !!props.customizeExpanded;

  return h("div", { className: "meal-card" + (status && status !== "skip" ? " done" : "") + (props.disabled ? " preview-disabled" : "") },
    h("div", { className: "check-circle" + (status && status !== "skip" ? " done" : "") }, status && status !== "skip" && h(Check, { size: 12 })),
    h("div", { style: { flex: 1 } },
      h("div", { className: "meal-top" },
        h("span", null, m.name),
        h("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
          h("span", null, m.time),
          hasCollapsibleExtras && h("button", {
            onClick: function () { setExpanded(!expanded); },
            style: { display: "flex", background: "none", border: "none", padding: 0, color: "#737373", cursor: "pointer" },
          }, expanded ? h(ChevronUp, { size: 16 }) : h(ChevronDown, { size: 16 }))
        )
      ),
      h("div", { className: "meal-food" }, m.food),
      h("div", { className: "meal-macro" },
        m.cal + " cal · " + m.p + "p / " + m.c + "c / " + m.f + "f",
        m.trainingAdjusted && h("span", { style: { color: "#3d97d3" } }, " · shifted for training time")),
      h("div", { className: "diff-row", style: { marginTop: 8 } },
        props.statusOpts.map(function (opt) {
          const isPartial = opt.id === "three_quarter" || opt.id === "half" || opt.id === "quarter";
          const active = status === opt.id;
          return h("button", {
            key: opt.id, disabled: props.disabled,
            onClick: function () { active ? props.onClearStatus() : props.onSetStatus(isPartial ? "partial" : opt.id, opt.pct); },
            className: "diff-btn" + (active ? (opt.id === "skip" ? " hard" : " easy") : ""),
          }, opt.label);
        })
      ),
      expanded && props.mealSwapControl ? props.mealSwapControl : null,
      hasSupplements && expanded && h(SupplementSection, {
        title: "Also take", supplements: supplements,
        logsToday: props.logsToday, toggleLog: props.toggleLog, disabled: props.disabled,
        compact: true, noCollapse: true,
      }),
      // Customize: the liked-foods picker + regenerate, merged in from the old separate Food Plan
      // tab — collapsed by default, same as every other collapsible section in this app. Regenerating
      // here applies immediately to whichever week is currently on screen; there's no separate
      // "apply to week" step, since this tab already knows which week that is.
      expanded && props.showCustomize && h("div", { style: { marginTop: 8 } },
        h("button", {
          onClick: function () { props.onToggleCustomize(); },
          style: { display: "flex", width: "100%", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", padding: "4px 0", color: "#737373", cursor: "pointer", fontSize: 12 },
        },
          h("span", null, "Replace Food Item" + (likedForMeal.length > 0 ? " (" + likedForMeal.length + " liked)" : "")),
          customizeExpanded ? h(ChevronUp, { size: 14 }) : h(ChevronDown, { size: 14 })
        ),
        customizeExpanded && h("div", { style: { marginTop: 8 } },
          h("input", {
            type: "text", className: "search-input", placeholder: "Search foods...",
            value: foodFilter, onChange: function (e) { setFoodFilter(e.target.value); },
            style: { marginBottom: 8 },
          }),
          MEAL_CARD_FOOD_CATS.map(function (cat) {
            const filtered = props.allFoods.filter(function (f) {
              return f.cat === cat.key && f.name.toLowerCase().indexOf(foodFilter.toLowerCase()) !== -1;
            }).sort(function (a, b) { return a.name.localeCompare(b.name); });
            if (foodFilter && filtered.length === 0) return null; // hide a category with no matches while searching
            const likedCountInCat = filtered.filter(function (f) { return likedForMeal.indexOf(f.name) !== -1; }).length;
            const catOpen = !!foodFilter || !!expandedFoodCats[cat.key];
            return h("div", { key: cat.key, style: { marginBottom: 4 } },
              h("button", {
                onClick: function () { setExpandedFoodCats(Object.assign({}, expandedFoodCats, { [cat.key]: !expandedFoodCats[cat.key] })); },
                style: { display: "flex", width: "100%", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", padding: "6px 0", cursor: "pointer" },
              },
                h("div", { className: "food-cat-title", style: { margin: 0 } },
                  cat.label + (likedCountInCat > 0 ? " (" + likedCountInCat + " liked)" : "")),
                catOpen ? h(ChevronUp, { size: 14 }) : h(ChevronDown, { size: 14 })
              ),
              catOpen && h("div", { className: "food-chip-grid" },
                filtered.map(function (f) {
                  const liked = likedForMeal.indexOf(f.name) !== -1;
                  const isCustom = (props.customFoods || []).some(function (c) { return c.name === f.name; });
                  return h("button", {
                    key: f.name, className: "food-chip" + (liked ? " liked" : ""),
                    onClick: function () { props.toggleLiked(props.mealKey, f.name); },
                  }, f.name + (isCustom ? " 📷" : ""));
                })
              )
            );
          }),
          h("div", { style: { display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" } },
            likedForMeal.length > 0 && h("button", {
              className: "ex-action-btn",
              onClick: function () { props.copyLikedToEmptyMeals(props.mealKey); },
            }, "Copy to other empty meals"),
            h("button", {
              className: "generate-btn", style: { marginTop: 0, flex: "0 0 auto" },
              onClick: function () { props.onRegenerate(); },
            }, "Regenerate This Meal"),
            props.canUndoRegenerate && h("button", {
              className: "undo-btn", style: { flex: "0 0 auto" },
              onClick: function () { props.onUndoRegenerate(); },
            }, "Undo last regenerate")
          )
        )
      ),
      // Rebalance my day: boosts THIS meal for today only (e.g. eating out tonight), shrinking the
      // other 3 meals today to compensate, proportional to their own size. Only available on the
      // actual current day — not a future preview, not a past day being looked back on.
      props.canRebalance && h("div", { style: { marginTop: 8 } },
        h("button", {
          onClick: function () { setShowRebalance(!showRebalance); },
          style: { display: "flex", width: "100%", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", padding: "4px 0", color: "#737373", cursor: "pointer", fontSize: 12 },
        },
          h("span", null, "Rebalance my day around this meal"),
          showRebalance ? h(ChevronUp, { size: 14 }) : h(ChevronDown, { size: 14 })
        ),
        showRebalance && h("div", { style: { marginTop: 8 } },
          h("p", { style: { fontSize: "11px", color: "#737373", margin: "0 0 8px" } },
            "Make this meal bigger today, taking the difference from your other 3 meals today, proportional to their size. Just for today — tomorrow's plan is unaffected."),
          h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
            [1.25, 1.5, 1.75, 2].map(function (mult) {
              return h("button", {
                key: mult, className: "ex-action-btn",
                onClick: function () { props.onRebalance(mult); setShowRebalance(false); },
              }, mult + "x");
            })
          )
        )
      )
    )
  );
}


// One saved (scanned/custom) food in the "Your Foods" list. Tap the name to open an inline editor
// for category and per-100g macros — the after-the-fact fix for a bad Open Food Facts import when
// the barcode isn't around to re-scan. Field values are held as STRINGS while editing and parsed
// on save, the same pattern as the barcode panel: storing numbers coerces a cleared field to 0 and
// the next keystroke lands after it ("05"). Name is deliberately NOT editable — liked-food picks
// reference foods by name, so a rename here would silently orphan them.
function CustomFoodRow(props) {
  const food = props.food;
  const [fields, setFields] = useState(null); // null = closed; { cat, cal, p, c, f } strings while editing
  function beginEdit() {
    setFields({
      cat: food.cat,
      cal: String(Math.round(food.cal)),
      p: String(Math.round(food.p * 10) / 10),
      c: String(Math.round(food.c * 10) / 10),
      f: String(Math.round(food.f * 10) / 10),
      basis: food.basis || "none", // "none" | "dry" | "cooked" — which state the per-100g numbers describe
      cookedYield: String(food.cookedYield || 3),
      servingGrams: food.servingGrams ? String(food.servingGrams) : "",
    });
  }
  function setField(key, val) {
    setFields(Object.assign({}, fields, (function () { const o = {}; o[key] = val; return o; })()));
  }
  function saveEdit() {
    const yieldNum = Math.max(1, Number(fields.cookedYield) || 3);
    const extra = fields.basis === "none" ? {} : { basis: fields.basis, cookedYield: yieldNum };
    const sg = Math.round(Number(fields.servingGrams) || 0);
    if (sg > 0) extra.servingGrams = sg;
    props.addCustomFood(food.name, fields.cat, {
      cal: Math.max(0, Number(fields.cal) || 0),
      p: Math.max(0, Number(fields.p) || 0),
      c: Math.max(0, Number(fields.c) || 0),
      f: Math.max(0, Number(fields.f) || 0),
    }, extra);
    setFields(null);
  }
  if (!fields) {
    return h("div", { className: "search-result-row", style: { cursor: "pointer" }, onClick: beginEdit },
      h("span", null, food.name + " (" + food.cat + (food.basis ? " · " + food.basis + " ×" + food.cookedYield : "") + ")"),
      h("span", { style: { display: "flex", alignItems: "center", gap: 8 } },
        h("span", { style: { fontSize: 11, color: "#737373" } }, "tap to edit"),
        h("button", {
          className: "logged-food-remove",
          onClick: function (e) { e.stopPropagation(); props.removeCustomFood(food.name); },
        }, "✕")
      )
    );
  }
  return h("div", { className: "search-result-row", style: { cursor: "default", display: "block" } },
    h("span", null, food.name),
    h("div", { style: { display: "flex", gap: 6, marginTop: 6 } },
      ["protein", "carb", "fat"].map(function (cat) {
        return h("button", {
          key: cat,
          className: "week-btn" + (fields.cat === cat ? " active" : ""),
          onClick: function () { setField("cat", cat); },
        }, cat);
      })
    ),
    h("div", { style: { display: "flex", gap: 6, marginTop: 6 } },
      [["cal", "cal"], ["p", "protein"], ["c", "carbs"], ["f", "fat"]].map(function (pair) {
        return h("label", { key: pair[0], style: { flex: 1, fontSize: 11, color: "#737373" } },
          pair[1] + " /100g",
          h("input", {
            type: "number", inputMode: "decimal", step: "0.1", min: "0",
            value: fields[pair[0]],
            onChange: function (e) { setField(pair[0], e.target.value); },
            style: { width: "100%" },
          })
        );
      })
    ),
    h("label", { style: { display: "block", fontSize: 11, color: "#737373", margin: "6px 0" } },
      "serving size (g) — what “one serving” weighs; powers the portion buttons when logging",
      h("input", { type: "number", inputMode: "numeric", min: "0", value: fields.servingGrams,
        onChange: function (e) { setField("servingGrams", e.target.value); }, style: { width: "100%" } })),
    h("div", { style: { display: "flex", gap: 8, marginTop: 8 } },
      h("button", { className: "swap-save-btn", style: { flex: 1 }, onClick: saveEdit }, "Save"),

  const timedStandalone = props.supplementList.filter(function (s) { return s.timing === "standalone" && s.time; });

    return { kind: "supplement", sortMin: timeToMinutes(s.time), supplement: s };

// Email + password only, deliberately: it's the simplest thing that actually works, and social
// login can be added later without disrupting anyone already using this. Rendered both inside
// Settings (where it shows the signed-in state and a sign-out button) and, via AuthGate, as the
// gate the whole app sits behind.
function AccountAuthPanel(props) {
  const [mode, setMode] = useState("signin"); // "signin" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [signupSent, setSignupSent] = useState(false);
  const [coachRequested, setCoachRequested] = useState(false);

  if (!props.authChecked) {
    return h("p", { style: { fontSize: 12, color: "#737373" } }, "Checking sign-in status\u2026");
  }

  if (props.session) {
    return h("div", null,
      h("p", { style: { fontSize: 13, margin: "0 0 10px" } }, "Signed in as " + props.session.user.email),
      h("button", {
        className: "ex-action-btn",
        onClick: function () { props.signOut(); },
      }, "Sign out")
    );
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!email || !password) { setError("Enter both an email and a password."); return; }
    setError("");
    setLoading(true);
    const action = mode === "signup" ? props.signUpWithEmail(email, password, coachRequested) : props.signInWithEmail(email, password);
    action.then(function (result) {
      setLoading(false);
      if (result.error) { setError(result.error.message); return; }
      if (mode === "signup" && !result.data.session) {
        // Email confirmation is on by default — no session yet until the person clicks the link in
        // their inbox. Signing in later (once confirmed) is what actually establishes the session;
        // this isn't a failure, just the expected next step.
        setSignupSent(true);
      }
    });
  }

  if (signupSent) {
    return h("p", { style: { fontSize: 12, color: "#4eba6f" } },
      "Check " + email + " for a confirmation link, then come back and sign in.");
  }

  return h("form", { onSubmit: handleSubmit },
    h("input", {
      type: "email", placeholder: "Email", value: email, autoComplete: "email",
      onChange: function (e) { setEmail(e.target.value); },
      style: { width: "100%", background: "#0a0a0a", border: "1px solid #404040", borderRadius: 8, padding: "8px 10px", fontSize: 13, color: "#f5f5f5", marginBottom: 8 },
    }),
    h("input", {
      type: "password", placeholder: "Password", value: password, autoComplete: mode === "signup" ? "new-password" : "current-password",
      onChange: function (e) { setPassword(e.target.value); },
      style: { width: "100%", background: "#0a0a0a", border: "1px solid #404040", borderRadius: 8, padding: "8px 10px", fontSize: 13, color: "#f5f5f5", marginBottom: 8 },
    }),
    error && h("p", { style: { fontSize: 12, color: "#f87171", margin: "0 0 8px" } }, error),
    // Signup only. Records a REQUEST, nothing more — coach access is granted by hand from the
    // admin panel, never by ticking this. Worded so that's obvious rather than implied, so nobody
    // ticks it expecting instant access and wonders why nothing happened.
    mode === "signup" && h("label", {
      style: { display: "flex", alignItems: "flex-start", gap: 8, margin: "0 0 10px", cursor: "pointer" },
    },
      h("input", { type: "checkbox", checked: coachRequested, onChange: function (e) { setCoachRequested(e.target.checked); }, style: { marginTop: 2 } }),
      h("span", { style: { fontSize: 12, color: "#a3a3a3", lineHeight: 1.45 } },
        "I'm a coach and want to train clients here",
        h("span", { style: { display: "block", fontSize: 11, color: "#737373" } },
          "Sent as a request \u2014 an admin reviews it before coaching tools are enabled."))),
    h("div", { style: { display: "flex", gap: 8 } },
      h("button", {
        type: "submit", className: "ex-action-btn", style: { flex: 1, background: "#1d4ed8", color: "#fff", borderColor: "#1d4ed8" }, disabled: loading,
      }, loading ? "\u2026" : mode === "signup" ? "Create account" : "Sign in"),
      h("button", {
        type: "button", className: "ex-action-btn", style: { flex: "0 0 auto" },
        onClick: function () { setMode(mode === "signup" ? "signin" : "signup"); setError(""); },
      }, mode === "signup" ? "Have an account?" : "New here?")
    )
  );
}

// Self-contained cloud-sync action button — its own loading state so a slow connection can't be
// mistaken for a silent no-op, and a confirm() gate since both directions this drives (backup,
// restore) are real, deliberate actions, not something to trigger by accident with a stray tap.
function CloudSyncButton(props) {
  const [loading, setLoading] = useState(false);
  return h("button", {
    className: "ex-action-btn", style: Object.assign({ width: "100%", marginTop: 10 }, props.danger ? { borderColor: "#f87171", color: "#f87171" } : {}), disabled: loading,
    onClick: function () {
      if (props.confirmMessage && !window.confirm(props.confirmMessage)) return;
      setLoading(true);
      props.onAction().finally(function () { setLoading(false); });
    },
  }, loading ? props.loadingLabel : props.label);
}

  return h("div", {

// Prepare a full program for someone who hasn't signed up yet. Uses the SAME CustomSetupWizard and

// difference is where it lands: an email-keyed coach_program_drafts row (migration 14) instead of
// a coach_assignments row, because there's no client_id to point at yet. The draft is inert until
// that person signs up AND accepts this coach's invitation; claim_coach_drafts() enforces that in
// SQL, not here.
function PrepareProgramForNewClient(props) {
  const [open, setOpen] = useState(false);
  const [email, setEmail] = useState("");
  const [wizardOpen, setWizardOpen] = useState(false);
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [drafts, setDrafts] = useState([]);

  function loadDrafts() {
    supabaseClient.from("coach_program_drafts")
      .select("id, client_email, created_at").is("claimed_at", null).order("created_at", { ascending: false })
      .then(function (r) { if (!r.error) setDrafts(r.data || []); });
  }
  useEffect(function () { if (open) loadDrafts(); }, [open]);

  function saveDraft(setup) {
    const config = buildWizardConfig(setup, FOOD_DB);
    const payload = Object.assign({}, config, { likedFoodsByMeal: setup.likedFoodsByMeal || null });
    const normalized = email.trim().toLowerCase();
    setBusy(true); setWizardOpen(false);
    // Upsert on the (coach_id, client_email) open-draft index: re-preparing replaces rather than
    // stacking, so nobody claims three half-finished versions of their own program.
    supabaseClient.from("coach_program_drafts")
      .select("id").eq("client_email", normalized).is("claimed_at", null)

              program_key: "custom", payload: payload, note: "Prepared by your coach before you signed up",

        onChange: function (e) { setEmail(e.target.value); }, style: { marginBottom: 8 } }),

// Owner-only signup approvals, rendered as its own bottom tab (the tab itself only exists for the
// owner — see the navbar). Presentational: it receives the list and reports approvals upward, so
// the badge count and the list can never disagree. The UI hiding is convenience, never the
// security boundary — pending_signups() and owner_approve_user() both re-check is_owner() in SQL
// on every call, so a tampered client gains nothing.
//
// Additive to the email-approve flow, not a replacement — that one stays useful for approving
// from a phone notification without opening the app.
function AdminTab(props) {
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");
  const pending = props.pendingSignups || [];

  function approve(userId, tier) {
    setBusyId(userId);
    supabaseClient.rpc("owner_approve_user", { target: userId, new_tier: tier })
      .then(function (r) {
        setBusyId(null);
        if (r.error) { setError("Couldn't approve — " + (r.error.message || "try again")); return; }
        setError("");
        // Refetch rather than splicing locally: the server list is the source of truth, and this
        // also picks up anyone who signed up while this screen was open.
        props.onRefresh();
      });
  }
  // Separate call, not a tier argument: coach status is a THIRD switch (the `coaches` table) on
  // top of approved and tier. Approving at tier 3 alone leaves someone without coaching tools —
  // that exact gap is what this button exists to close.
  function approveCoach(userId) {
    setBusyId(userId);
    supabaseClient.rpc("owner_approve_coach", { target: userId })
      .then(function (r) {
        setBusyId(null);
        if (r.error) { setError("Couldn't approve as coach — " + (r.error.message || "try again")); return; }
        setError("");
        props.onRefresh();
      });
  }

  return h("div", null,
    h("h2", { style: { fontSize: 16, margin: "0 0 4px" } }, "Signup approvals"),
    h("p", { style: { fontSize: 12, color: "#737373", margin: "0 0 12px", lineHeight: 1.5 } },

    pending.length === 0
      ? h("p", { style: { fontSize: 13, color: "#737373" } }, "Nobody waiting right now.")
      : pending.map(function (p) {
          return h("div", { key: p.user_id, style: { background: "#171717", border: "1px solid " + (p.coach_requested ? "#3d97d3" : "#262626"), borderRadius: 8, padding: 12, marginBottom: 8 } },
            h("p", { style: { margin: "0 0 2px", fontSize: 13, overflow: "hidden", textOverflow: "ellipsis" } }, p.email),
            h("p", { style: { margin: "0 0 10px", fontSize: 11, color: "#737373" } },
              "Signed up " + new Date(p.signed_up_at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })),
            // Shown only when they actually asked. It's a claim they made about themselves, not a
            // verified fact, so the wording stays neutral — the decision is still entirely yours.
            p.coach_requested && h("p", { style: { margin: "-6px 0 10px", fontSize: 12, color: "#3d97d3" } },
              "\u25CF Says they're a coach and wants to train clients"),
            // A flex COLUMN with gap, not margins between siblings. Margins here were fragile —
            // one was accidentally conditional (collapsing to zero on non-requester rows), and
            // .ex-action-btn/.swap-save-btn differ by 2px in height because one has a 1px border
            // and the other has none. Explicit box-sizing + a shared minHeight makes all three
            // buttons the same size regardless of which class they use.
            h("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
              h("div", { style: { display: "flex", gap: 8 } },
                h("button", {
                  className: "ex-action-btn", disabled: busyId === p.user_id,
                  style: { flex: "1 1 0", minWidth: 0, minHeight: 36, boxSizing: "border-box" },
                  onClick: function () { approve(p.user_id, 1); },
                }, busyId === p.user_id ? "\u2026" : "Approve (free)"),
                h("button", {
                  className: "swap-save-btn", disabled: busyId === p.user_id,
                  // 1px transparent border matches ex-action-btn's box so the two line up exactly.
                  style: { flex: "1 1 0", minWidth: 0, minHeight: 36, boxSizing: "border-box", border: "1px solid transparent" },
                  onClick: function () { approve(p.user_id, 3); },
                }, busyId === p.user_id ? "\u2026" : "Approve (full)")),
              // Always available, not just when requested — you may know someone's a coach without

              h("button", {

        })
  );

function computeQuickAddFoods(foodLogByDate, limit) {
  limit = limit || 8;
  const byName = {};
  Object.keys(foodLogByDate || {}).forEach(function (dateKey) {
    (foodLogByDate[dateKey] || []).forEach(function (e) {
      if (!e || !e.name) return;
      const ts = parseInt(String(e.id).split("-")[0], 10) || 0;
      const cur = byName[e.name];
      if (!cur) {
        byName[e.name] = { name: e.name, grams: e.grams, per100: e.per100 || null, count: 1, lastTs: ts };
      } else {
        cur.count += 1;
        if (ts >= cur.lastTs) { cur.lastTs = ts; cur.grams = e.grams; cur.per100 = e.per100 || cur.per100; }
      }
    });
  });
  return Object.keys(byName).map(function (k) { return byName[k]; })
    .sort(function (a, b) { return (b.count - a.count) || (b.lastTs - a.lastTs); })
    .slice(0, limit);
}
