            rirTargetReps: null,   // no valid RIR target comes out of a corrected-weight week —
            rirMissHistory: [],    // week 2 starts the graded system clean, not mid-pattern from
          });                     // what was actually a bad estimate, not real fatigue.
          return { state: out, escalateToDeload: escalate };
        }
        const update = computeNextWeekRirUpdate(maxReps, cur.rirTargetReps, cur.rirMissHistory, ctx.prevWeekPositionInPhase, ctx.nextWeekPositionInPhase, RIR_PHASE_LENGTH, cur.weight, ctx.rating || null, ex.bodyweight);
        if (update.shouldEscalateToDeload) escalate = true;
        out = Object.assign({}, cur, {
          weight: update.weightBump != null ? update.weightBump : cur.weight,
          repsTarget: update.targetReps != null ? update.targetReps : cur.repsTarget,
          rirTargetReps: update.targetReps,
          rirMissHistory: update.missHistory,
        });
        return { state: out, escalateToDeload: escalate };
      }

      const rating = ctx.rating;
      if (!rating) return { state: null, escalateToDeload: false }; // no rating given at all — no signal to act on, hold
      const range = effectiveRepRange(ex, cur);
      if (rating === "hard") {
        // Too difficult — weight still holds, but the rep target now reflects what was actually
        // achieved (their best set that week) instead of freezing at whatever the old target was
        // regardless of real performance. Clamped to the exercise's own rep range either way.
        out = Object.assign({}, cur, { repsTarget: Math.max(range.repLow, Math.min(maxReps, range.repHigh)) });
        return { state: out, escalateToDeload: escalate };
      }
      if (maxReps >= range.repHigh) {
        if (range.unbanded) {
          // A bodyweight movement at the rep ceiling has run out of reps. Three levers remain,
          // in order of least disruption: add external load if the person owns any; otherwise
          // add a set, up to the volume cap; otherwise step up to a harder variant and restart
          // the rep climb. The ladder step is deliberately LAST — it changes the exercise, which
          // is a bigger event for the person than one more set.
          out = Object.assign({}, cur, progressAtBodyweightCeiling(ex, cur, ctx));
        } else {
          out = Object.assign({}, cur, {
            weight: nextWeightIncrement(cur.weight),
            repsTarget: range.repLow,
          });
        }
      } else {
        out = Object.assign({}, cur, { repsTarget: Math.min(cur.repsTarget + (range.unbanded ? 2 : 1), range.repHigh) });
      }
  return { state: out, escalateToDeload: escalate };
}

// What happens when a bodyweight movement reaches BODYWEIGHT_REP_CEILING. Returns only the fields
// that change, so the caller keeps everything else about the exercise state intact.
function progressAtBodyweightCeiling(ex, cur, ctx) {
  // A coached client does not get autoregulated unless their coach has granted it (migration 19).
  // Holding at the ceiling is the honest result: the person keeps training at 30 reps and their
  // coach decides what happens next. Silently adding a set would be the app overruling a
  // prescription, and silently doing nothing WITHOUT saying so would leave them stuck with no
  // explanation — hence the flag, which the UI surfaces.
  if (ctx && ctx.isCoached && !ctx.autoregulationAllowed) {
    return { repsTarget: BODYWEIGHT_REP_CEILING, autoregulationSuppressed: true };
  }
  const equipment = (ctx && ctx.equipmentAvailable) || [];
  const canLoad = equipment.some(function (e) { return e === "weight_belt" || e === "vest" || e === "dumbbell" || e === "barbell"; });
  // 1. External load available: the movement stops being bodyweight and joins the normal weighted
  //    path. Reps stay high and walk down into the band over subsequent weeks rather than
  //    dropping to repLow immediately — a 30-rep-to-8-rep jump in one week is a load estimate
  //    nobody can make well, and calibration would spend weeks unwinding it.
  if (canLoad) {
    return { pendingLoadPrompt: true, repsTarget: BODYWEIGHT_REP_CEILING };
  }
  // 2. No load: add a set, up to the cap.
  //    BODYWEIGHT_MAX_SETS is the ceiling on what AUTOREGULATION may add, not a global cap on
  //    sets. A coach prescribing 7, or an accepted volume-increase recommendation, can legitimately
  //    put an exercise above it — and when that happens autoregulation simply has no headroom left
  //    and falls through to the ladder step below. It never removes a set someone else added.
  const currentSets = effectiveSets(ex, cur);
  if (currentSets < BODYWEIGHT_MAX_SETS) {
    return { setsOverride: currentSets + 1, repsTarget: BODYWEIGHT_REP_CEILING };
  }
  // 3. Reps and sets both exhausted: step up the ladder and restart the rep climb. Sets reset to
  //    the exercise default, because the harder variant is a fresh starting point, not a
  //    continuation of the volume that was compensating for an easy one.
  const next = nextLadderRung(ex, equipment);
  if (next) {
    return { pendingLadderStep: next.name, setsOverride: null, repsTarget: null };
  }
  // Top of the ladder with no equipment: hold. There is nothing dishonest to offer here, and
  // silently inflating reps past the ceiling would be worse than saying nothing.
  return { repsTarget: BODYWEIGHT_REP_CEILING, atLadderTop: true };
}

// Ties the three pieces above together into the one full update completeWeek() runs per RIR-mode
// exercise: was this week's target met, what's the updated miss-history (resetting at a phase
// boundary), does the miss pattern call for recalibrating or escalating to a deload, and what's the
// actual target (with recalibration/ceiling applied) for the upcoming week. Recalibration dampens
// the SCHEDULE'S demanded step specifically (not the carried-forward actual) — only half the normal
// delta gets applied, rather than the full ramp, when a short run of misses suggests the pace is
// currently too aggressive for this particular exercise.
function computeNextWeekRirUpdate(prevActualReps, prevWeekTargetReps, priorMissHistory, prevWeekPositionInPhase, nextWeekPositionInPhase, phaseLength, currentWeight, prevRating, isBodyweight) {
  const startingNewPhase = nextWeekPositionInPhase === 1 && prevWeekPositionInPhase !== 1;
  const missedThisWeek = prevWeekTargetReps != null && prevActualReps != null && prevActualReps < prevWeekTargetReps;
  const baseMissHistory = startingNewPhase ? [] : (priorMissHistory || []).slice();
  const missHistory = prevActualReps != null ? baseMissHistory.concat([missedThisWeek]) : baseMissHistory;
  const pattern = evaluateRirMissPattern(missHistory);

  // Offset applied against the reps ACTUALLY being performed, not the band: a set that has drifted
  // high needs to be taken closer to failure regardless of what its band nominally says.
  const prevTargetRIR = adjustTargetRIRForReps(computeTargetRIRForWeek(prevWeekPositionInPhase, phaseLength), prevActualReps);
  const nextTargetRIR = adjustTargetRIRForReps(computeTargetRIRForWeek(nextWeekPositionInPhase, phaseLength), prevActualReps);
  let computed = computeRirAdjustedTarget(prevActualReps, prevTargetRIR, nextTargetRIR, currentWeight, isBodyweight);

  // CORROBORATION (added 2026-07-30). Two independent signals — what was performed, and what the
  // person said about it — should not be read one at a time when both are sitting right there.
  //   missed + "hard"  -> dampen NOW, on the first miss, instead of waiting for a second
  //                       consecutive one. The miss pattern alone needs two weeks to be sure;
  //                       a rating that agrees with the first miss IS the second piece of evidence.
  //   met + "hard"     -> the target was reached but it cost everything. The ramp is about to
  //                       demand more (target RIR drops as the phase runs); dampen that step
  //                       rather than walking someone into a wall they already told us about.
  //   met + "easy"     -> HOLD. Explicit product decision (user, 2026-07-30): the schedule already
  //                       plans the progression, and feeling good on a met target doesn't earn a
  //                       jump ahead of it. Ratings brake here; they never accelerate.
  //   missed + "easy"  -> the two disagree. Trust the numbers, run the normal path, no dampening.
  // Deload escalation stays NUMBERS-ONLY on purpose: a rating can slow the next step down, but
  // pulling someone into a recovery week is a big enough action to require the performance pattern.
  const ratedHard = prevRating === "hard";
  const shouldDampen = (pattern.shouldRecalibrate || ratedHard) && !pattern.shouldEscalateToDeload;

  if (shouldDampen && prevActualReps != null) {
    const fullDelta = prevTargetRIR - nextTargetRIR;
    const dampenedDelta = Math.round(fullDelta / 2);
    const dampenedRaw = Math.max(1, prevActualReps + dampenedDelta);
    computed = (isBodyweight || dampenedRaw <= RIR_REP_CEILING)
      ? { targetReps: dampenedRaw, weightBump: null }
      : { targetReps: RIR_REP_CEILING, weightBump: nextWeightIncrement(currentWeight) };
  }

  return {
    missHistory: missHistory,
    shouldEscalateToDeload: pattern.shouldEscalateToDeload,
    targetReps: computed.targetReps,
    weightBump: computed.weightBump,
  };
}

const VOLUME_CEILING_PER_MUSCLE = 20; // weekly sets per muscle group — sits at the point multiple
// sources agree returns clearly start flattening; deloads exist specifically to walk volume back
// down before building toward this again, so it's a backstop, not a target to reach quickly.
// Evaluates every muscle group that had at least one exercise trained in the completed phase, and
// returns one recommendation per muscle group that qualifies (more than half its exercises
// "consistently met," and adding a set wouldn't push the group's weekly total past the ceiling).
// The exercise chosen to receive the added set is whichever qualifying exercise showed the
// strongest signal — most weeks progressed, ties broken by most weeks rated easy/just-right.
function evaluateVolumeIncrease(allExercisesFlat, phaseWeeks, logsByWeek, difficultyByWeek, skippedByWeek, exerciseStateSource, rirModeEnabled) {
  const byMuscle = {};
  allExercisesFlat.forEach(function (ex) {
    const state = exerciseStateSource[ex.id] || {};
    const muscle = effectiveMuscle(ex, state);
    if (!muscle) return;
    if (!byMuscle[muscle]) byMuscle[muscle] = [];
    byMuscle[muscle].push(ex);
  });
  const recommendations = [];
  Object.keys(byMuscle).forEach(function (muscle) {
    const exercises = byMuscle[muscle];
    const scores = {};
    exercises.forEach(function (ex) {
      const state = exerciseStateSource[ex.id] || {};
      const range = effectiveRepRange(ex, state);
      scores[ex.id] = scoreExerciseInPhase(ex.id, phaseWeeks, logsByWeek, difficultyByWeek, skippedByWeek, range, rirModeEnabled ? (state.rirMissHistory || []) : null);
    });
    const qualifying = exercises.filter(function (ex) { return exerciseConsistentlyMet(scores[ex.id]); });
    if (qualifying.length === 0 || qualifying.length / exercises.length <= 0.5) return;
    const currentTotalSets = exercises.reduce(function (sum, ex) {
      return sum + effectiveSets(ex, exerciseStateSource[ex.id] || {});
    }, 0);
    if (currentTotalSets >= VOLUME_CEILING_PER_MUSCLE) return;
    let best = null, bestScore = -1;
    qualifying.forEach(function (ex) {
      const s = scores[ex.id];
      const score = s.progressedWeeks * 10 + s.easyRightWeeks;
      if (score > bestScore) { bestScore = score; best = ex; }
    });
    if (best) {
      recommendations.push({
        muscle: muscle, exerciseId: best.id, exerciseName: best.name,
        currentSets: effectiveSets(best, exerciseStateSource[best.id] || {}),
        muscleTotalSets: currentTotalSets,
      });
    }
  });
  return recommendations;
}
// Rough rule of thumb: every ~2.5% change in weight shifts achievable reps by about 1, in the
// opposite direction. Only returns a suggestion once the shift would move at least 1 rep.
function suggestRepShift(oldWeight, newWeight, repLow, repHigh) {
  if (!oldWeight || !newWeight || oldWeight <= 0) return null;
  const pct = (newWeight - oldWeight) / oldWeight;
  const rawShift = Math.round(pct / 0.025);
  if (rawShift === 0) return null;
  // Cap how far a single change can shift the range — beyond this, the linear "2.5% per rep"
  // heuristic stops being a realistic prescription and it's more honest to just log actual
  // performance and let normal week-to-week progression take over from there.
  const shift = Math.max(-6, Math.min(6, rawShift));
  const newLow = Math.max(1, repLow - shift);
  const newHigh = Math.max(newLow + 1, repHigh - shift);
  return { pct: Math.round(pct * 100), shift: shift, repLow: newLow, repHigh: newHigh };
}
function baseExerciseState(exercises) {
  const state = {};
  DAYS.forEach((d) => exercises[d].exercises.forEach((ex) => {
    state[ex.id] = { weight: ex.weight, repsTarget: effectiveRepRange(ex, null).repLow, nameOverride: null, notes: "" };
  }));
  return state;
}
function allExercises(exercises) {
  return DAYS.flatMap((d) => exercises[d].exercises.map((ex) => Object.assign({}, ex, { day: d })));
}

// Returns the "top set" value for one exercise in one week: heaviest logged weight for a weighted
// movement, or highest rep count for a bodyweight movement — the same value ProgressChart plots.
// null when there are no valid logged sets that week.
function topSetValueForWeek(weekLogs, exId, isBodyweight) {
  const sets = ((weekLogs || {})[exId] || []).filter(function (s) { return s && s.reps != null; });
  if (sets.length === 0) return null;
  if (isBodyweight) return Math.max.apply(null, sets.map(function (s) { return s.reps || 0; }));
  return Math.max.apply(null, sets.map(function (s) { return s.weight || 0; }));
}

// Looks at the last `window` weeks of top-set data for a single exercise and decides whether it's
// stalled — i.e. the most recent value is no higher than the best value seen earlier in the window.
// Needs the full window of consecutive logged weeks to say anything (a gap = not enough evidence).
// A flat OR declining trend both count as a stall; only a genuine new high clears it.
function exerciseIsStalled(logsByWeek, exId, isBodyweight, uptoWeek, windowSize) {
  const vals = [];
  for (let w = uptoWeek - windowSize + 1; w <= uptoWeek; w++) {
    if (w < 1) return false; // not enough history yet
    const v = topSetValueForWeek(logsByWeek[w], exId, isBodyweight);
    if (v == null) return false; // a missing week breaks the run — don't guess
    vals.push(v);
  }
  const latest = vals[vals.length - 1];
  const bestEarlier = Math.max.apply(null, vals.slice(0, vals.length - 1));
  return latest <= bestEarlier; // no new high across the window = stalled
}

// Scans every exercise for a multi-week performance stall. Returns a summary { stalledCount,
// consideredCount, ratio } so the caller can decide whether the plateau is broad enough to suggest a
// deload. Only exercises with a full window of consecutive logged weeks are "considered" — ones the
// person hasn't trained enough to judge are excluded from both numerator and denominator, so a
// half-logged program can't produce a misleading ratio.
function computePerformanceStall(exercisesDef, logsByWeek, uptoWeek, windowSize) {
  let stalled = 0, considered = 0;
  allExercises(exercisesDef).forEach(function (ex) {
    // "considered" = has a value in every week of the window
    let hasFullWindow = true;
    for (let w = uptoWeek - windowSize + 1; w <= uptoWeek; w++) {
      if (w < 1 || topSetValueForWeek(logsByWeek[w], ex.id, ex.bodyweight) == null) { hasFullWindow = false; break; }
    }
    if (!hasFullWindow) return;
    considered++;
    if (exerciseIsStalled(logsByWeek, ex.id, ex.bodyweight, uptoWeek, windowSize)) stalled++;
  });
  return { stalledCount: stalled, consideredCount: considered, ratio: considered > 0 ? stalled / considered : 0 };
}

// ---------------------------------------------------------------------------
// §8b INSIGHT ENGINE — analyzeProgram(data, def, opts) -> findings[]
// ---------------------------------------------------------------------------
// Deterministic, pure, on-device. No LLM, no network, and no clock of its own:
// `opts.today` is injected, so the same saved data always produces the same
// findings. That injection is what makes the whole thing testable.
//
// THREE GROUND RULES, settled at design time:
//   1. Findings INFORM, never act. The deload / volume-increase / RIR machinery
//      stays the only thing that changes a prescription. Nothing here writes.
//   2. Where a finding overlaps a system that already exists, it REFERENCES that
//      system instead of restating it (`references` on the finding, and the
//      deload-pending clause in the under-fuel sentence).
//   3. Thresholds are FIXED, DOCUMENTED CONSTANTS in v1 — INSIGHT_THRESHOLDS
//      below. Nothing adapts per user until there's real data to tune against.
//
// A NOTE ON TIME, because it bounds what this can honestly claim:
// training logs are keyed by PROGRAM WEEK (`prog.logs[week]`), and a week
// advances only when the user completes one — so a week is not a fixed number of
// days. Nutrition and weight are keyed by CALENDAR DATE. Nothing in the saved
// data maps one onto the other for weeks already gone by, and logged sets carry
// no timestamp to rebuild it from. So a cross-domain finding joins its two sides
// only at "recently": a training window ending at the last completed week, and a
// nutrition window ending today. Both describe the present, and the evidence
// carries each side in its own units, so the claim stays checkable rather than
// implying a precision the data doesn't support.
//
// Finding shape: { id, domain, domains, tier, severity, title, sentence,
//                  evidence, references, sortKey }
//   severity  1..3, 3 strongest. Numeric so coach triage sorts by max directly.
//   tier      DERIVED from the domains crossed, never set per finding: anything
//             touching nutrition is tier 3, training-only is tier 2.
//   evidence  { weeks, numbers } — every claim carries what it was computed from.

const INSIGHT_THRESHOLDS = {
  // --- training stall (shared by under-fuel and per-lift plateau) ---
  STALL_WINDOW_WEEKS: 3,        // same window the deload system's stall check uses
  BROAD_STALL_RATIO: 0.5,       // >half the judgeable lifts stalled = program-wide, not per-lift
  BROAD_STALL_SEVERE_RATIO: 0.67,
  MIN_CONSIDERED_LIFTS: 2,      // below this there's no "pattern", just one lift

  // --- fuelling ---
  FUEL_WINDOW_DAYS: 14,
  MIN_FOOD_DAYS: 5,             // logged days needed in the window before averaging means anything
  UNDERFUEL_PCT: 0.10,          // 10% under target is past normal logging slop
  UNDERFUEL_SEVERE_PCT: 0.15,

  // --- weight trend ---
  WEIGHT_WINDOW_DAYS: 14,
  MIN_WEIGHT_DAYS: 8,           // matches computeAdaptiveTDEE's own floor, deliberately
  CUT_MIN_WEEKLY_LOSS_LB: 0.25, // slower than this on a cut isn't distinguishable from noise
  BULK_MIN_WEEKLY_GAIN_LB: 0.15,
  MAINTAIN_DRIFT_LB: 0.75,      // either direction

  // --- adherence ---
  ADHERENCE_WEEKS: 3,
  MIN_ADHERENCE_WEEKS: 2,
  ADHERENCE_RATIO: 0.80,
  ADHERENCE_SEVERE_RATIO: 0.60,

  // --- weekend variance ---
  WEEKEND_WINDOW_DAYS: 28,
  MIN_WEEKEND_DAYS: 2,
  MIN_WEEKDAY_DAYS: 4,
  WEEKEND_EXCESS_PCT: 0.20,
  WEEKEND_SEVERE_PCT: 0.35,

  // --- goal transition ---
  GOAL_ARRIVAL_MARGIN_LB: 2, // within this many lb of target counts as "arrived" — a cut doesn't
                             // have to touch the exact number to the decimal for this to be real.

  // --- lapse nudge ---
  LAPSE_NUDGE_MIN_DAYS: 3, // days since any dated activity before the calibration nudge shows

  // --- work regression (finding 6) ---
  // Measures top-set WORK (weight x reps), not load alone. The RIR ramp deliberately trades reps
  // for weight as a phase progresses, so work wobbles week to week even when everything is fine —
  // these are set well past that wobble. A 25% drop is roughly "you did a quarter less than your
  // best recent week," which the ramp alone does not produce.
  WORK_DROP_PCT: 0.25,
  WORK_DROP_SEVERE_PCT: 0.40,
};

// The three built-in programs encode their goal in the program itself; Custom
// carries it explicitly from the wizard. Mapped rather than inferred so a
// weight-trend finding can speak about a goal on every program, not just Custom.
const INSIGHT_PROGRAM_GOAL = { cutting: "cut", cruise: "maintain", hypertrophy: "bulk" };

// Tier follows the DOMAINS CROSSED, not the individual finding: touching
// nutrition at all puts a finding behind tier 3, training-only sits at tier 2.
// Weight-trend counts as nutrition — the trend is nutrition's outcome measure,
// and the action it points at (recalculating the target) is a nutrition action.
function insightTierFor(domains) {
  return domains.indexOf("nutrition") !== -1 ? 3 : 2;
}

// Calendar date keys walking backward from `todayK`, most recent first. Built off
// localDateKey (not toISOString) for the same timezone reason documented there.
function insightDateKeysBack(todayK, days) {
  const out = [];
  const d = new Date(todayK + "T00:00:00");
  for (let i = 0; i < days; i++) {
    out.push(localDateKey(d));
    d.setDate(d.getDate() - 1);
  }
  return out;
}

// Calories actually logged on one date. Deliberately the same rule as the app's
// own loggedCaloriesForDate: read the free-form food log only (each entry carries
// its own per-100g data at the time it was logged), never the meal-checklist
// percentages — meal content changes when the rotation advances, so a checked-off
// meal from weeks ago can't be reconstructed reliably. Entries whose food can't
// be resolved contribute nothing rather than guessing.
function insightCaloriesForDate(prog, dateKey, foods) {
  const entries = (prog.foodLog || {})[dateKey] || [];
  return entries.reduce(function (a, entry) {
    const per100 = entry.per100 || foods.filter(function (f) { return f.name === entry.name; })[0];
    if (!per100) return a;
    return a + (per100.cal * entry.grams) / 100;
  }, 0);
}

// Days inside the window that have at least one food entry, with each day's
// calories. Days with no entries are EXCLUDED rather than counted as zero: an
// unlogged day is missing data, not a fast, and averaging zeros in would
// manufacture an under-fuelling finding out of someone simply not logging.
function insightFoodDays(prog, todayK, windowDays, foods) {
  const days = [];
  insightDateKeysBack(todayK, windowDays).forEach(function (k) {
    const entries = (prog.foodLog || {})[k] || [];
    if (entries.length === 0) return;
    days.push({ date: k, cal: insightCaloriesForDate(prog, k, foods) });
  });
  const total = days.reduce(function (a, d) { return a + d.cal; }, 0);
  return { days: days, count: days.length, avgCal: days.length > 0 ? total / days.length : 0 };
}

// Smoothed weight trend over the window, in lb/week. Same two-half comparison
// computeAdaptiveTDEE already uses, on purpose — this must agree with the number
// the user is shown there rather than offering a second, differently-computed
// truth. It inherits the same simplification: logged entries are treated as
// consecutive days when converting to a weekly rate, so a sparsely-logged window
// reports a slightly compressed span.
function insightWeightTrend(prog, todayK, windowDays) {
  const logs = prog.dailyWeightLogs || {};
  const keys = insightDateKeysBack(todayK, windowDays)
    .filter(function (k) { return logs[k] != null; })
    .sort();
  if (keys.length < INSIGHT_THRESHOLDS.MIN_WEIGHT_DAYS) return null;
  const mid = Math.floor(keys.length / 2);
  function avg(ks) { return ks.reduce(function (a, k) { return a + logs[k]; }, 0) / ks.length; }
  const firstAvg = avg(keys.slice(0, mid));
  const secondAvg = avg(keys.slice(mid));
  const halfSpanDays = keys.length / 2;
  return {
    weeklyRateLb: Math.round((((secondAvg - firstAvg) / halfSpanDays) * 7) * 100) / 100,
    firstAvg: Math.round(firstAvg * 10) / 10,
    secondAvg: Math.round(secondAvg * 10) / 10,
    daysUsed: keys.length,
  };
}

// ---- Finding 1: under-fuelling stall [training x nutrition] ----------------
// The one finding that genuinely crosses domains, and the reason the time note
// at the top of this section exists. Fires only when BOTH sides are true at once:
// training has broadly stopped moving, and intake over the recent window sits
// meaningfully under the planned target. Neither half alone says this.
function insightUnderFuelStall(ctx) {
  const T = INSIGHT_THRESHOLDS;
  if (ctx.lastCompletedWeek < T.STALL_WINDOW_WEEKS) return null;
  if (ctx.plannedCalories == null || ctx.plannedCalories <= 0) return null;
  const stall = computePerformanceStall(ctx.def.exercises, ctx.prog.logs || {}, ctx.lastCompletedWeek, T.STALL_WINDOW_WEEKS);
  if (stall.consideredCount < T.MIN_CONSIDERED_LIFTS) return null;
  if (stall.ratio < T.BROAD_STALL_RATIO) return null;
  if (ctx.fuel.count < T.MIN_FOOD_DAYS) return null;
  const pctBelow = (ctx.plannedCalories - ctx.fuel.avgCal) / ctx.plannedCalories;
  if (pctBelow < T.UNDERFUEL_PCT) return null;

  const severe = stall.ratio >= T.BROAD_STALL_SEVERE_RATIO && pctBelow >= T.UNDERFUEL_SEVERE_PCT;
  const avgCal = Math.round(ctx.fuel.avgCal);
  const pct = Math.round(pctBelow * 100);
  // Referencing, not duplicating: if the deload system has already put a
  // recommendation on the table, this points at it instead of implying the user
  // is being told about the stall for the first time.
  const deloadPending = !!ctx.prog.deloadRecommendation;
  const sentence =
    stall.stalledCount + " of " + stall.consideredCount + " lifts with enough history haven't set a new best in " +
    T.STALL_WINDOW_WEEKS + " weeks, and over the last " + ctx.fuel.count + " logged days intake averaged " +
    avgCal + " cal against a " + ctx.plannedCalories + " cal target — " + pct + "% under. " +
    (deloadPending
      ? "A deload recommendation is already waiting on the training side; the fuelling gap is the part that isn't covered there."
      : "Under-fuelling and a stall this broad tend to travel together.");

  return {
    id: "under_fuel_stall",
    domains: ["training", "nutrition"],
    severity: severe ? 3 : 2,
    title: "Training has stalled while intake is running under target",
    sentence: sentence,
    evidence: {
      weeks: {
        window: T.STALL_WINDOW_WEEKS,
        uptoWeek: ctx.lastCompletedWeek,
        stalledLifts: stall.stalledCount,
        consideredLifts: stall.consideredCount,
      },
      numbers: {
        avgLoggedCalories: avgCal,
        plannedCalories: ctx.plannedCalories,
        pctBelowTarget: pct,
        foodDaysLogged: ctx.fuel.count,
        foodWindowDays: T.FUEL_WINDOW_DAYS,
      },
    },
    references: deloadPending ? ["deloadRecommendation"] : [],
    sortKey: "under_fuel_stall",
  };
}

// ---- Finding 2: weight-trend divergence [weight x goal] -------------------
// The trend is going somewhere other than where the stated goal points. Says so
// and stops — recalculating the target is adaptive TDEE's job, and it already
// asks for explicit acceptance before changing anything.
function insightWeightTrendDivergence(ctx) {
  const T = INSIGHT_THRESHOLDS;
  if (!ctx.goal || !ctx.trend) return null;
  const rate = ctx.trend.weeklyRateLb;
  let diverging = false, severe = false, expectation = "";

  if (ctx.goal === "cut") {
    diverging = rate > -T.CUT_MIN_WEEKLY_LOSS_LB;
    severe = rate > 0;
    expectation = "a cut expects the trend to fall";
  } else if (ctx.goal === "bulk") {
    diverging = rate < T.BULK_MIN_WEEKLY_GAIN_LB;
    severe = rate < 0;
    expectation = "a bulk expects the trend to rise";
  } else if (ctx.goal === "maintain") {
    diverging = Math.abs(rate) > T.MAINTAIN_DRIFT_LB;
    severe = Math.abs(rate) > T.MAINTAIN_DRIFT_LB * 1.5;
    expectation = "maintenance expects the trend to hold flat";
  }
  if (!diverging) return null;

  const dir = rate > 0 ? "up" : (rate < 0 ? "down" : "flat");
  return {
    id: "weight_trend_divergence",
    domains: ["nutrition"],
    severity: severe ? 3 : 2,
    title: "Weight trend isn't tracking the goal",
    sentence:
      "Over " + ctx.trend.daysUsed + " logged weigh-ins the trend is " + dir + " about " +
      Math.abs(rate) + " lb/week (" + ctx.trend.firstAvg + " to " + ctx.trend.secondAvg + " lb), and " +
      expectation + ". The adaptive TDEE estimate is built from these same weigh-ins and can " +
      "recalculate the target when you're ready.",
    evidence: {
      weeks: { uptoWeek: ctx.lastCompletedWeek },
      numbers: {
        weeklyRateLb: rate,
        firstHalfAvgLb: ctx.trend.firstAvg,
        secondHalfAvgLb: ctx.trend.secondAvg,
        weighInsUsed: ctx.trend.daysUsed,
        goal: ctx.goal,
      },
    },
    references: ["adaptiveTDEE"],
    sortKey: "weight_trend_divergence",
  };
}

// ---- Finding: goal transition arrived [weight x goal] ----------------------
// The opposite news from weight_trend_divergence: the trend hasn't drifted off the
// goal, it's reached it. Scoped to custom-program cuts specifically, because only
// Custom carries a real numeric targetWeight from the wizard — the built-in Cutting
// template has no specific number to have "arrived" at. Self-resolving by design:
// the moment the person actually switches off a cut goal (Cruise, or edits their
// custom goal), ctx.goal stops being "cut" and this stops firing on its own — no
// separate dismiss-tracking needed, unlike a UI-only banner would require.
function insightGoalTransitionArrived(ctx) {
  const T = INSIGHT_THRESHOLDS;
  if (ctx.goal !== "cut") return null;
  const config = ctx.data.customProgramConfig;
  if (ctx.data.activeProgram !== "custom" || !config || config.targetWeight == null) return null;
  if (!ctx.trend) return null;
  if (ctx.trend.secondAvg > config.targetWeight + T.GOAL_ARRIVAL_MARGIN_LB) return null;

  return {
    id: "goal_transition_arrived",
    domains: ["nutrition"],
    severity: 1, // good news, not a problem — sorts below anything that actually needs attention
    title: "You've reached your goal weight",
    sentence:
      "Your trend is sitting at " + ctx.trend.secondAvg + " lb, at or within " + T.GOAL_ARRIVAL_MARGIN_LB +
      " lb of your " + config.targetWeight + " lb target. Cruise holds here at maintenance so the " +
      "result sticks, instead of drifting back — switch whenever you're ready.",
    evidence: {
      weeks: { uptoWeek: ctx.lastCompletedWeek },
      numbers: {
        trendWeightLb: ctx.trend.secondAvg,
        targetWeightLb: config.targetWeight,
        weighInsUsed: ctx.trend.daysUsed,
      },
    },
    references: [],
    sortKey: "goal_transition_arrived",
  };
}

// ---- Finding 3: adherence gap [prescribed x logged] ----------------------
// Sets prescribed versus sets actually logged, across recent COMPLETED weeks —
// the in-progress week is excluded so a week that's simply mid-flight never
// reads as a shortfall. Logged sets are counted across every id present in that
// week's logs, including this-week substitutes logging under their own altId,
// so swapping an exercise is never mistaken for skipping it.
function insightAdherenceGap(ctx) {
  const T = INSIGHT_THRESHOLDS;
  const weeks = [];
  for (let w = ctx.lastCompletedWeek; w >= 1 && weeks.length < T.ADHERENCE_WEEKS; w--) weeks.unshift(w);
  if (weeks.length < T.MIN_ADHERENCE_WEEKS) return null;

  const flat = allExercises(ctx.def.exercises);
  let prescribed = 0, logged = 0;
  const perWeek = [];
  weeks.forEach(function (w) {
    const weekLogs = (ctx.prog.logs || {})[w] || {};
    const weekSkipped = (ctx.prog.skipped || {})[w] || {};
    let wPrescribed = 0;
    flat.forEach(function (ex) {
      if (weekSkipped[ex.id]) return; // a deliberately skipped exercise was never owed
      wPrescribed += effectiveSets(ex, ctx.exerciseStateSource[ex.id] || {});
    });
    let wLogged = 0;
    Object.keys(weekLogs).forEach(function (exId) {
      wLogged += (weekLogs[exId] || []).filter(function (s) { return s && s.reps != null; }).length;
    });
    prescribed += wPrescribed;
    logged += wLogged;
    perWeek.push({ week: w, prescribed: wPrescribed, logged: wLogged });
  });
  if (prescribed <= 0) return null;

  const ratio = logged / prescribed;
  if (ratio >= T.ADHERENCE_RATIO) return null;
  return {
    id: "adherence_gap",
    domains: ["training"],
    severity: ratio < T.ADHERENCE_SEVERE_RATIO ? 3 : 2,
    title: "Logged volume is running below what's prescribed",
    sentence:
      "Across weeks " + weeks[0] + "–" + weeks[weeks.length - 1] + ", " + logged + " of " + prescribed +
      " prescribed sets were logged (" + Math.round(ratio * 100) + "%). Progression is computed from " +
      "logged sets, so the gap changes what the program asks for next.",
    evidence: {
      weeks: { window: weeks, perWeek: perWeek, uptoWeek: ctx.lastCompletedWeek },
      numbers: { setsLogged: logged, setsPrescribed: prescribed, adherencePct: Math.round(ratio * 100) },
    },
    references: [],
    sortKey: "adherence_gap",
  };
}

// ---- Finding 4: per-lift plateau, with peer context [training] -----------
// One lift stuck while its peers keep moving. Deliberately suppressed whenever
// the stall is BROAD: at that point it's a program-wide pattern that the deload
// system and finding 1 already speak to, and repeating it per-lift would be the
// duplication ground rule 2 forbids. The stall DECISION comes from
// exerciseIsStalled — the same primitive the deload check uses — and the top-set
// values are re-read here only to carry as evidence.
function insightLiftPlateaus(ctx) {
  const T = INSIGHT_THRESHOLDS;
  if (ctx.lastCompletedWeek < T.STALL_WINDOW_WEEKS) return [];
  const logs = ctx.prog.logs || {};
  const stall = computePerformanceStall(ctx.def.exercises, logs, ctx.lastCompletedWeek, T.STALL_WINDOW_WEEKS);
  if (stall.consideredCount < T.MIN_CONSIDERED_LIFTS) return [];
  if (stall.ratio >= T.BROAD_STALL_RATIO) return []; // broad, not per-lift — see above

  const out = [];
  allExercises(ctx.def.exercises).forEach(function (ex) {
    const vals = [];
    for (let w = ctx.lastCompletedWeek - T.STALL_WINDOW_WEEKS + 1; w <= ctx.lastCompletedWeek; w++) {
      if (w < 1) return;
      const v = topSetValueForWeek(logs[w], ex.id, ex.bodyweight);
      if (v == null) return; // incomplete window — not judgeable, same rule as computePerformanceStall
      vals.push(v);
    }
    if (!exerciseIsStalled(logs, ex.id, ex.bodyweight, ctx.lastCompletedWeek, T.STALL_WINDOW_WEEKS)) return;
    const latest = vals[vals.length - 1];
    const bestEarlier = Math.max.apply(null, vals.slice(0, vals.length - 1));
    const declining = latest < bestEarlier;
    const state = ctx.exerciseStateSource[ex.id] || {};
    const name = state.nameOverride || ex.name;
    const unit = ex.bodyweight ? "reps" : "lb";
    const movingPeers = stall.consideredCount - stall.stalledCount;
    out.push({
      id: "lift_plateau:" + ex.id,
      domains: ["training"],
      severity: declining ? 3 : 2,
      title: name + " has plateaued",
      sentence:
        name + "'s top set has gone " + (declining ? "backward" : "flat") + " across " + T.STALL_WINDOW_WEEKS +
        " weeks (" + vals.join(" → ") + " " + unit + "), while " + movingPeers + " of " + stall.consideredCount +
        " tracked lifts are still moving. That pattern is specific to this lift, not the program.",
      evidence: {
        weeks: {
          window: T.STALL_WINDOW_WEEKS,
          uptoWeek: ctx.lastCompletedWeek,
          topSets: vals,
          movingPeers: movingPeers,
          consideredLifts: stall.consideredCount,
        },
        numbers: { latest: latest, bestEarlier: bestEarlier, declining: declining, unit: unit, exerciseId: ex.id },
      },
      references: [],
      sortKey: "lift_plateau:" + ex.id,
    });
  });
  return out;
}

// ---- Finding 6: work regression [training] -------------------------------
// THE GAP THIS EXISTS TO CLOSE (found live 2026-07-30, from real user data):
// insightLiftPlateaus measures LOAD only — topSetValueForWeek returns max weight and discards
// reps. A lift going 20lb x30 -> 27.5lb x20 -> 30lb x5 therefore reads as three weeks of strictly
// increasing weight and never trips the stall check, while the actual work done collapsed from 600
// to 150 (75% down). The person had also rated it "Too Difficult" — a signal they typed in
// themselves, which no detector read at all. Load-only progression scored a burial as progress.
//
// So: top-set WORK (weight x reps; reps alone for bodyweight, matching topSetValueForWeek's own
// convention), compared against the best week earlier in the same window. Difficulty CORROBORATES
// but never fires alone — a "Too Difficult" in the last week of a phase is the RIR ramp working as
// designed (it peaks at RIR 0), so on its own it means nothing. The two together mean something.
function insightTopSetWorkForWeek(weekLogs, exId, isBodyweight) {
  const sets = ((weekLogs || {})[exId] || []).filter(function (s) { return s && s.reps != null; });
  if (sets.length === 0) return null;
  let best = null;
  sets.forEach(function (s) {
    const reps = s.reps || 0;
    const weight = isBodyweight ? null : (s.weight || 0);
    const work = isBodyweight ? reps : weight * reps;
    if (best == null || work > best.work) best = { work: work, reps: reps, weight: weight };
  });
  return best;
}

// The every-5th-week-or-extraDeloadWeeks rule, as one expression. The same test is inlined in
// computePhaseWeeks and weeksUntilNextDeload; this is a shared copy for new code rather than a
// refactor of those two, which are load-bearing and verified.
function isDeloadWeekNumber(week, extraDeloadWeeks) {
  return week % 5 === 0 || (extraDeloadWeeks || []).indexOf(week) !== -1;
}

function insightWorkRegression(ctx) {
  const T = INSIGHT_THRESHOLDS;
  if (ctx.lastCompletedWeek < T.STALL_WINDOW_WEEKS) return [];
  const logs = ctx.prog.logs || {};
  const extra = ctx.prog.extraDeloadWeeks;
  const firstWeek = ctx.lastCompletedWeek - T.STALL_WINDOW_WEEKS + 1;
  if (firstWeek < 1) return [];
  // A window containing a recovery week isn't comparable: deload sets are halved, so work drops by
  // design and every exercise would flag. Skipping the whole window rather than just the deload
  // week keeps the comparison honest — "less work than your best recent week" has to mean weeks
  // that were actually asking for the same thing.
  for (let w = firstWeek; w <= ctx.lastCompletedWeek; w++) {
    if (isDeloadWeekNumber(w, extra)) return [];
  }

  const latestRatings = (ctx.prog.exerciseDifficulty || {})[ctx.lastCompletedWeek] || {};
  const considered = [], dropped = [];
  allExercises(ctx.def.exercises).forEach(function (ex) {
    const weeks = [];
    for (let w = firstWeek; w <= ctx.lastCompletedWeek; w++) {
      const v = insightTopSetWorkForWeek(logs[w], ex.id, ex.bodyweight);
      if (v == null) return; // incomplete window — not judgeable, same rule as the stall check
      weeks.push(v);
    }
    considered.push(ex);
    const latest = weeks[weeks.length - 1];
    const earlier = weeks.slice(0, weeks.length - 1);
    let bestEarlier = earlier[0];
    earlier.forEach(function (v) { if (v.work > bestEarlier.work) bestEarlier = v; });
    if (bestEarlier.work <= 0) return;
    const dropRatio = (bestEarlier.work - latest.work) / bestEarlier.work;
    if (dropRatio < T.WORK_DROP_PCT) return;
    dropped.push({ ex: ex, latest: latest, bestEarlier: bestEarlier, dropRatio: dropRatio,
                   ratedHard: latestRatings[ex.id] === "hard", weeks: weeks });
  });

  if (considered.length < T.MIN_CONSIDERED_LIFTS || dropped.length === 0) return [];

  function setLabel(v, isBodyweight) {
    return isBodyweight ? v.reps + " reps" : v.weight + "lb x" + v.reps;
  }
  const pct = function (r) { return Math.round(r * 100); };

  // Program-wide rather than per-lift when most of the roster moved together — same reasoning as
  // insightLiftPlateaus' broad-stall suppression, and it keeps a genuinely bad week from filling
  // the digest with one card per exercise.
  if (dropped.length / considered.length >= T.BROAD_STALL_RATIO) {
    const hardCount = dropped.filter(function (d) { return d.ratedHard; }).length;
    const severe = dropped.length / considered.length >= T.BROAD_STALL_SEVERE_RATIO || hardCount > 0;
    return [{
      id: "work_regression_broad",
      domains: ["training"],
      severity: severe ? 3 : 2,
      title: "Your sessions got noticeably harder",
      sentence:
        dropped.length + " of " + considered.length + " tracked lifts did meaningfully less work in week " +
        ctx.lastCompletedWeek + " than in their best of the previous " + (T.STALL_WINDOW_WEEKS - 1) +
        " weeks" + (hardCount > 0 ? ", and you rated " + hardCount + " of them too difficult" : "") +
        ". Weight on the bar can still be climbing while this happens — it's the reps paying for it.",
      evidence: {
        weeks: { window: T.STALL_WINDOW_WEEKS, uptoWeek: ctx.lastCompletedWeek,
                 droppedLifts: dropped.length, consideredLifts: considered.length },
        numbers: { droppedCount: dropped.length, consideredCount: considered.length, ratedHardCount: hardCount },
      },
      references: [],
      sortKey: "work_regression_broad",
    }];
  }

  return dropped.map(function (d) {
    const state = ctx.exerciseStateSource[d.ex.id] || {};
    const name = state.nameOverride || d.ex.name;
    const severe = d.dropRatio >= T.WORK_DROP_SEVERE_PCT || d.ratedHard;
    return {
      id: "work_regression:" + d.ex.id,
      domains: ["training"],
      severity: severe ? 3 : 2,
      title: name + " is doing less work than it was",
      sentence:
        name + "'s best set went from " + setLabel(d.bestEarlier, d.ex.bodyweight) + " to " +
        setLabel(d.latest, d.ex.bodyweight) + " — about " + pct(d.dropRatio) + "% less work" +
        (d.ratedHard ? ", and you rated it too difficult" : "") +
        (d.ex.bodyweight ? "." : ". The weight went up or held, so load alone looks like progress."),
      evidence: {
        weeks: { window: T.STALL_WINDOW_WEEKS, uptoWeek: ctx.lastCompletedWeek,
                 works: d.weeks.map(function (v) { return v.work; }) },
        numbers: { dropPct: pct(d.dropRatio), latestWork: d.latest.work, bestEarlierWork: d.bestEarlier.work,
                   ratedHard: d.ratedHard, exerciseId: d.ex.id },
      },
      references: [],
      sortKey: "work_regression:" + d.ex.id,
    };
  });
}

// ---- Finding 5: weekend variance [nutrition x time] ----------------------
// Weekend intake running consistently above weekday intake. Pure calendar-space,
// so no week/date join is involved. Unlogged days are excluded, not zeroed —
// the same reasoning as insightFoodDays.
function insightWeekendVariance(ctx) {
  const T = INSIGHT_THRESHOLDS;
  const window = insightFoodDays(ctx.prog, ctx.today, T.WEEKEND_WINDOW_DAYS, ctx.foods);
  const weekend = [], weekday = [];
  window.days.forEach(function (d) {
    const dow = new Date(d.date + "T00:00:00").getDay(); // 0 = Sunday, 6 = Saturday
    (dow === 0 || dow === 6 ? weekend : weekday).push(d.cal);
  });
  if (weekend.length < T.MIN_WEEKEND_DAYS || weekday.length < T.MIN_WEEKDAY_DAYS) return null;
  function avg(a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; }
  const wkndAvg = avg(weekend), wkdyAvg = avg(weekday);
  if (wkdyAvg <= 0) return null;
  const excess = (wkndAvg - wkdyAvg) / wkdyAvg;
  if (excess < T.WEEKEND_EXCESS_PCT) return null;

  return {
    id: "weekend_variance",
    domains: ["nutrition"],
    severity: excess >= T.WEEKEND_SEVERE_PCT ? 3 : 2,
    title: "Weekend intake runs well above weekdays",
    sentence:
      "Over the last " + T.WEEKEND_WINDOW_DAYS + " days, weekend intake averaged " + Math.round(wkndAvg) +
      " cal against " + Math.round(wkdyAvg) + " cal on weekdays — " + Math.round(excess * 100) +
      "% higher, across " + weekend.length + " weekend and " + weekday.length + " weekday logged days. " +
      "Two days at that gap move the weekly average more than they look like they should.",
    evidence: {
      weeks: { windowDays: T.WEEKEND_WINDOW_DAYS },
      numbers: {
        weekendAvgCalories: Math.round(wkndAvg),
        weekdayAvgCalories: Math.round(wkdyAvg),
        excessPct: Math.round(excess * 100),
        weekendDaysLogged: weekend.length,
        weekdayDaysLogged: weekday.length,
      },
    },
    references: [],
    sortKey: "weekend_variance",
  };
}

// The engine's single entry point. `def` is the resolved program definition (the
// same object the app builds for the active program), `opts.today` is a
// YYYY-MM-DD key, and `opts.foods` is the food list used to resolve log entries
// that predate self-contained per100 data. Returns findings sorted strongest
// first, with a total ordering (severity, then sortKey) so repeated calls on
// unchanged data are byte-identical — the digest's seen-set depends on that.
function analyzeProgram(data, def, opts) {
  opts = opts || {};
  if (!data || !def || !def.exercises) return [];
  const prog = (data.programs || {})[data.activeProgram];
  if (!prog) return [];

  const config = data.customProgramConfig || null;
  const isShared = data.activeProgram !== "custom";
  const today = opts.today || todayKey();
  const foods = opts.foods || FOOD_DB.concat(data.customFoods || []);
  const ctx = {
    data: data,
    def: def,
    prog: prog,
    today: today,
    foods: foods,
    // Same shared-vs-per-program split the app itself uses: the three built-in
    // programs share one progression state, Custom keeps its own.
    exerciseStateSource: isShared ? (data.sharedExerciseState || {}) : (prog.exerciseState || {}),
    // The in-progress week is never judged — only weeks the user actually finished.
    lastCompletedWeek: (prog.currentWeek || 1) - 1,
    goal: isShared ? INSIGHT_PROGRAM_GOAL[data.activeProgram] : (config && config.goal) || null,
    plannedCalories: (config && config.macros && config.macros.cal) || null,
  };
  ctx.fuel = insightFoodDays(prog, today, INSIGHT_THRESHOLDS.FUEL_WINDOW_DAYS, foods);
  ctx.trend = insightWeightTrend(prog, today, INSIGHT_THRESHOLDS.WEIGHT_WINDOW_DAYS);

  // goal_transition_arrived and weight_trend_divergence can both look at the same flat-at-target
  // trend and each say something technically true but contradictory in the same digest ("trend
  // isn't falling anymore" right next to "you've arrived"). Arrival takes precedence — same
  // suppression pattern insightLiftPlateaus already uses under a broad stall.
  const goalTransition = insightGoalTransitionArrived(ctx);
  // A lift whose LOAD stalled or went backward is already reported by insightLiftPlateaus, and its
  // work will usually have dropped too — reporting both would be the same lift twice in one digest,
  // in two vocabularies. Plateau wins because it's the more specific claim; work regression exists
  // for the case plateau structurally cannot see (load climbing while reps collapse).
  const plateaus = insightLiftPlateaus(ctx);
  const plateauIds = {};
  plateaus.forEach(function (f) { plateauIds[(f.evidence.numbers || {}).exerciseId] = true; });
  const workRegressions = insightWorkRegression(ctx).filter(function (f) {
    const exId = (f.evidence.numbers || {}).exerciseId;
    return !exId || !plateauIds[exId];
  });
  const findings = []
    .concat(insightUnderFuelStall(ctx) || [])
    .concat(goalTransition ? [] : (insightWeightTrendDivergence(ctx) || []))
    .concat(goalTransition || [])
    .concat(insightAdherenceGap(ctx) || [])
    .concat(plateaus)
    .concat(workRegressions)
    .concat(insightWeekendVariance(ctx) || []);

  findings.forEach(function (f) {
    f.tier = insightTierFor(f.domains);
    f.domain = f.domains.join("x");
  });
  findings.sort(function (a, b) {
    if (b.severity !== a.severity) return b.severity - a.severity;
    return a.sortKey < b.sortKey ? -1 : (a.sortKey > b.sortKey ? 1 : 0);
  });
  return findings;
}

// COACH TRIAGE anchor: the last day this program state shows any dated activity —
// the max date key across weigh-ins and food logs (ISO keys, so string max IS date
// max). This is what gets injected as opts.today when a COACH runs the engine on a
// client: a lapsed client's windows anchor to when they last logged, so the coach
// still sees what was happening when they stopped — labelled as of that date, never
// dressed as current. The user's own digest deliberately does NOT use this: it
// anchors to the real today, and lapses are the lapse nudge's job, not the engine's.
// Returns null when nothing dated has ever been logged — callers must skip the
// engine entirely then rather than invent an anchor.
function insightLastActivityKey(prog) {
  if (!prog) return null;
  var best = null;
  [prog.dailyWeightLogs, prog.foodLog].forEach(function (store) {
    Object.keys(store || {}).forEach(function (k) {
      // Guard against non-date keys ever creeping into these stores: a valid
      // anchor must look like an ISO day. Anything else is ignored, not sorted.
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      if (store === prog.foodLog && (!store[k] || store[k].length === 0)) return; // empty day = no activity
      if (best === null || k > best) best = k;
    });
  });
  return best;
}

// Days between two YYYY-MM-DD keys, parsed as LOCAL midnight — same reasoning the coach-triage
// "as of" label already uses: parsing as UTC would shift the day for western timezones. Assumes
// a is on/after b chronologically (that's the only order this app ever calls it with).
function daysBetweenKeys(a, b) {
  function local(k) { const p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  return Math.round((local(a) - local(b)) / 86400000);
}

// LAPSE NUDGE: reuses insightLastActivityKey — the exact same "last dated activity" signal coach
// triage already anchors to, so the two features can never disagree about what counts as a lapse.
// Deliberately has no dismiss-state of its own to track: logging a fresh weigh-in or food entry IS
// what resolves it — the moment that happens, the underlying signal moves and this stops firing on
// its own, same self-resolving shape as goal_transition_arrived. The copy is framed as calibration
// upkeep, never guilt — this exists to keep adaptive TDEE accurate, not to scold a gap in logging.
function computeLapseNudge(prog, todayK) {
  const lastActive = insightLastActivityKey(prog);
  if (!lastActive) return null;
  const daysSince = daysBetweenKeys(todayK, lastActive);
  if (daysSince < INSIGHT_THRESHOLDS.LAPSE_NUDGE_MIN_DAYS) return null;
  return {
    daysSince: daysSince,
    message: "It's been " + daysSince + " days since your last weigh-in or food log. Your adaptive " +
      "TDEE estimate is only as fresh as what it's built from \u2014 one weigh-in keeps it calibrated.",
  };
}

// ---- Storage key scoping ----
// localStorage is per-ORIGIN, not per-path. Production (inthelabfitness.com) and staging
// (smarthouse820.github.io/ITLv…) are different origins today, so they're already separate — but
// only because a custom domain is pointing where it should. If that domain were ever removed or
// lapsed, production would fall back onto the same origin as staging and the two would silently
// start sharing one set of data: real training history and throwaway test data in the same object,
// last write wins, with the automatic backup then pushing whichever won up to whichever account
// happened to be signed in.
//
// Renaming the key wouldn't help, since both deployments run the identical file and would rename in
// lockstep. Scoping it to the PATH does, because that's the one thing that differs between them —
// and it keeps the two deployments byte-identical, which is the whole point of having a staging
// copy at all.
//

    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeV2(JSON.parse(raw));
    // First load after key scoping shipped: adopt whatever this browser already had under the old
    // unscoped key. Deliberately a COPY, not a move — the old key is left in place rather than
    // deleted. Nothing writes to it from here on, so it can't cause a collision, and leaving it
    // means a rollback to a previous build still finds the data instead of looking like a wiped
    // install. It can be cleaned up in a later release once this has settled.
    const legacy = localStorage.getItem(LEGACY_SHARED_KEY);
    if (legacy) {
      try { localStorage.setItem(STORAGE_KEY, legacy); } catch (e) { /* quota — read it anyway */ }
      return normalizeV2(JSON.parse(legacy));
    }
    const oldRaw = localStorage.getItem("cutting-tracker-data-v1");
    if (oldRaw) return migrateV1(JSON.parse(oldRaw));
    return makeDefaultData();
  } catch (e) {
    return makeDefaultData();
  }

// notification is a bonus for when the screen is off or another app is up.

// account section's quiet sync-status line, so it deliberately doesn't try to handle every
// possible span (weeks, months); a plain date is a perfectly fine fallback that far out.
function formatRelativeTime(date) {

// anything worth restoring?" check, so the two can never disagree — they're the same question asked
// in two directions, and having them drift apart is how you get a prompt that offers to restore
// nothing, or refuses to offer something real.
//
// The original version tested only `currentWeek > 1 || logs non-empty`, which missed the most
// important case: someone who has finished setup but hasn't yet logged a training session. That's
// exactly the person the restore prompt exists for, since setup is the biggest single investment
// of effort in onboarding.
//
// exerciseState is deliberately NOT checked here — freshProgramState seeds it with a default entry
// for every exercise, so it's non-empty on a brand-new install and can't distinguish real use from
// none. Account-level signals (a completed Custom wizard, customised weights) are handled separately
// in the caller, since they live on the profiles row rather than in any program's state.
const REAL_USE_BUCKETS = [
  "logs", "nutritionLogs", "hydrationLogs", "milestoneActuals", "groceryLogs", "skipped",
  "customMealOverrides", "exerciseDifficulty", "foodLog", "sleepLogs", "dailyWeightLogs",
  "supplementLogs", "supersetGroups", "exerciseWeekOverrides", "sessionAdjustments",
  "mealDateOverrides",
];
function programStateHasRealData(state) {
  if (!state) return false;
  if (state.currentWeek > 1) return true;
  for (let i = 0; i < REAL_USE_BUCKETS.length; i++) {
    const bucket = state[REAL_USE_BUCKETS[i]];
    if (bucket && Object.keys(bucket).length > 0) return true;
  }
  if (Array.isArray(state.extraDeloadWeeks) && state.extraDeloadWeeks.length > 0) return true;
  return false;
}

const APP_VERSION = "2026-08-21T06:18:06";

// Signing out has to be unconditional, because every failure mode here ends the same way: a person
// tapping a button that does nothing.
//
// What actually went wrong in practice: supabase-js defaults to a GLOBAL sign-out, a server call
// needing a valid access token. Once the JWT expires the server returns 403, the library reports
// failure — but has already discarded the local session. No SIGNED_OUT event fires, so AuthGate
// never learns, App stays mounted, and the UI shows a signed-in user against a client holding
// nothing. Tapping again then fails with AuthSessionMissingError, a different error for the same
// underlying reason. A stale session is often precisely WHY someone is reaching for Sign out, so
// this fails exactly when it's needed.
//
// So: try global, fall back to local, swallow both outcomes, then reload. The reload is the point —
// on the next load AuthGate calls getSession(), finds nothing, and renders the sign-in screen. That
// depends on no event, no listener ordering, and no assumption about which internal state the
// library managed to clear. Sign-out is rare enough that a reload costs nothing.
function signOutEverywhereOrLocally() {
  function ignore() { return null; }
  return Promise.resolve()
    .then(function () { return supabaseClient.auth.signOut().catch(ignore); })
    .then(function (r) {
      if (r && r.error) return supabaseClient.auth.signOut({ scope: "local" }).catch(ignore);
      return r;
    })
    .catch(ignore)
    .then(function () {
      // Belt and braces: if the library left a token behind, drop it, so the reload can't find a
      // half-valid session and put us straight back where we started.
      try {
        Object.keys(localStorage)
          .filter(function (k) { return k.indexOf("sb-") === 0 && k.indexOf("-auth-token") !== -1; })
          .forEach(function (k) { localStorage.removeItem(k); });
      } catch (e) { /* storage unavailable — the reload still lands on the gate */ }
      window.location.reload();
    });
}

// Builds the complete customProgramConfig from a wizard completion. Pure and module-level so the
// SAME function serves both paths: the client running their own wizard (completeCustomSetup below)
// and a coach running it on a client's behalf (CoachPrescriptionEditor) — the prescribed config is
// byte-for-byte what the client would have built themselves.
function buildWizardConfig(setup, foods) {
  const idMap = ["m1", "m2", "m3", "m4"];
  const nameMap = { m1: "Meal 1", m2: "Meal 2", m3: "Meal 3", m4: "Meal 4" };
  const mealsWeek = idMap.map(function (id, i) {
    const r = setup.planResults[i];
    const foodStr = r.items.map(function (it) { return formatMealItem(it, foods); }).join(" + ");
    return { id: id, time: setup.slots[i].time, name: nameMap[id], food: foodStr, cal: Math.round(r.cal), p: Math.round(r.p), c: Math.round(r.c), f: Math.round(r.f), items: r.items };
  });
  const intraWorkoutEntry = setup.intraWorkout ? {
    id: "iw", name: "Intra-Workout",
    time: setup.trainingTime ? formatTimeHM(setup.trainingTime) : "",
    food: setup.intraWorkout.p + "g protein isolate + " + setup.intraWorkout.c + "g fast carbs (e.g. Cluster Dextrin) + electrolytes" +
      (setup.trainingTime ? "" : " — add a Training Time in your program settings to slot this into your workout window"),
    cal: Math.round(setup.intraWorkout.p * 4 + setup.intraWorkout.c * 4 + setup.intraWorkout.f * 9),
    p: setup.intraWorkout.p, c: setup.intraWorkout.c, f: setup.intraWorkout.f,
  } : null;
  const fullMealsWeek = intraWorkoutEntry ? mealsWeek.concat([intraWorkoutEntry]) : mealsWeek;
  const mealsByWeek = { 1: fullMealsWeek, 2: fullMealsWeek, 3: fullMealsWeek, 4: fullMealsWeek };
  const overrideForGrocery = {};
  idMap.forEach(function (id, i) { overrideForGrocery[id] = mealsWeek[i]; });
  const groceryList = computeCustomGrocery(overrideForGrocery, foods);
  const groceryByWeek = { 1: groceryList, 2: groceryList, 3: groceryList, 4: groceryList };
  return {
    setupComplete: true,
    goal: setup.goal, currentWeight: setup.currentWeight, targetWeight: setup.targetWeight,
    activity: setup.activity, weeksNeeded: setup.weeksNeeded, macros: setup.macros, age: setup.age,
    exercises: setup.exercises, slots: setup.slots, milestones: setup.milestones,
    mealsByWeek: mealsByWeek, groceryByWeek: groceryByWeek, trainingTime: setup.trainingTime || null,
    dietStyle: setup.dietStyle || "standard", gender: setup.gender || null, heightCm: setup.heightCm || null,
    intraWorkout: setup.intraWorkout || null,
    // Set directly here, not via the queued toggleRirMode path — a brand-new program has no
    // existing phase to protect from mid-phase mixing, so the wizard's choice can just take
    // effect immediately from week 1.
    rirModeEnabled: setup.trainingStyle === "rir",
  };
}

    // Two defences:
    //   1. A screen wake lock while resting, so the countdown keeps running in the common case of
    //      the phone sitting face-up on the bench. Released as soon as rest ends.
    //   2. A visibility check that compares against the WALL CLOCK on return, so a rest that

    if (!cloudSyncAllowed()) return Promise.reject(new Error("Cloud backup is turned off"));

  // timer that uploads this device's EMPTY state over the account's real data, while the prompt is

    // Settings and in state, but nothing consulted it, so turning it off changed the label and

    // than not offering one, because someone reads "Off" and believes it.
    if (!syncAllowed) { setSyncStatus("idle"); return; }

    // The reconciliation effect above normally makes this unreachable — it exists for the case
    // where it doesn't (storage failure, future effect reordering, a code path nobody predicted).

        likedFoodsByMeal: profile.liked_foods_by_meal,

  // Detects the exact "lost phone, signed into a fresh device" scenario: signs in, local data

  // this, recovering requires already knowing the Restore button exists — a bad ask for a study
  // participant who just lost a phone and doesn't know this app's settings menu at all. Checked
  // once per session (the ref), and never overrides anything if local data ISN'T untouched — this

  const [restorePromptCloudSummary, setRestorePromptCloudSummary] = useState(null);

    if (!session || restorePromptChecked.current) return;

    // that would be painful to redo, and both live on the profiles row rather than in any program's
    // state — which is why the cloud side below queries profiles as well as program_states.
    const localAccountSetup = !!data.customProgramConfig
      || Object.keys(data.sharedExerciseState || {}).length > 0
      || (data.supplementList || []).length > 0;

      return !programStateHasRealData(data.programs[key]);

    // gate immediately rather than stalling normal syncing behind a check that doesn't apply.
    if (!localLooksUntouched) { setFreshDeviceCheckDone(true); return; }

      supabaseClient.from("program_states").select("program_key, state").eq("user_id", session.user.id),

      .then(function (results) {

  function setClientAutoregulation(clientId, granted, effectiveWeek, reason) {

    // 'superseded'. The UNIQUE (client, program_key, week, kind, status) key makes the supersede

      return String(b.created_at).localeCompare(String(a.created_at));

      .select("id, payload").eq("client_id", req.client_id).eq("kind", req.kind)

    return supabaseClient.rpc("pending_signups").then(function (r) {
      setPendingSignups(r.error ? [] : (r.data || []));
    });
  }
  useEffect(function () {
    if (!userId) { setIsOwner(false); setPendingSignups([]); return; }
    let cancelled = false;
    supabaseClient.rpc("is_owner").then(function (r) {
      if (cancelled) return;

  useEffect(function () { refreshCoaching(); }, [userId]);
  // Safety net for the pre-built program claim. respondToInvite() claims at the natural moment,

  useEffect(function () {
    if (!userId) return;

  useEffect(function () {

  // The invite badge on the gear (below) is only honest if the list stays current while the app is

    return function () { clearInterval(interval); document.removeEventListener("visibilitychange", onVisible); };
  }, [userId]);

  function inviteClient(email) {
    setCoachingBusy(true);

      .then(function (r) {

      .update({ status: accept ? "active" : "revoked" }).eq("id", linkId)
      .then(function (r) {

  const [pendingAssignments, setPendingAssignments] = useState([]);

    return supabaseClient.rpc("my_pending_assignments", { current_week: week })
      .then(function (r) {

  //   2. Idempotent two ways: every merge below is a no-op when repeated with the same payload

  //      already handled, so neither a re-run effect, a second tab, nor a failed server write can

  const [appliedBanners, setAppliedBanners] = useState([]); // undo is per-session; after reload the change simply stands

  function withProgramPatch(cur, key, patch) {

    progs[key] = Object.assign({}, progs[key], patch);
    return Object.assign({}, cur, { programs: progs });

  // effective_week. Consequence, shared with the client's own swaps: a rotation-keyed override
  // recurs every 4 weeks until changed — a coach meal prescription persists, it doesn't expire.
  // exercise_week overrides are absolute-keyed and need no translation.
  function resolveAssignmentWeekKey(cur, a) {
    if (a.kind !== "meal_overrides") return a.effective_week;
    const p = cur.programs[a.program_key] || {};

      return {

  // Calories actually logged for a given real calendar date — deliberately reads only the free-form
  // food log (self-contained per-100g data at the time it was logged), not the meal-checklist
  // percentages. Meal-plan content can change when the 4-week rotation advances, so reconstructing
  // "what a checked-off meal was" for a date weeks ago isn't reliable — a raw food-log entry is.
  function loggedCaloriesForDate(dateKey) {
    const entries = prog.foodLog[dateKey] || [];
    return entries.reduce(function (a, entry) {
      const per100 = entry.per100 || allFoods.filter(function (f) { return f.name === entry.name; })[0];

  // Adaptive TDEE estimate, in the spirit of MacroFactor's approach: instead of trusting a formula
  // computed once at setup and never revisited, this compares your real smoothed weight trend
  // against your real logged calorie intake and infers what your true expenditure must have been.
  // Simplification worth knowing: this uses one fixed blended energy density (3500 kcal/lb) rather
  // than a density that slides with your rate of change the way more sophisticated commercial
  // models do — it still self-corrects over time, just with less precision than that finer model.
  // Thin wrapper over the pure computeAdaptiveTDEEFrom (top level, harness-driven).
  function computeAdaptiveTDEE() {
    return computeAdaptiveTDEEFrom(prog.dailyWeightLogs, loggedCaloriesForDate);
  }
  const adaptiveTDEE = computeAdaptiveTDEE();
  const plannedCalories = (data.customProgramConfig && data.customProgramConfig.macros) ? data.customProgramConfig.macros.cal : null;
  // Closes the adaptive-TDEE loop: instead of just flagging that the implied TDEE has diverged from
  // the plan and asking the person to manually redo setup, this recalculates the target directly —
  // same goal-adjustment and diet-style split logic as the original wizard math (macrosFromMaintenance),
  // just fed the empirically-measured maintenance number instead of the Mifflin-St Jeor estimate.
  // Uses the most recently logged daily weight (not the original setup-time weight) for the protein
  // target, since that's the actual current bodyweight the adaptive estimate is already built from.
  // Only updates the TARGET macros/slots — it deliberately does not re-solve or touch the already-
  // generated meals, since that's a separate, explicit action (regenerate in the Food Plan tab).
  function updateMacrosFromAdaptiveTDEE() {
    const config = data.customProgramConfig;
    if (!config || !adaptiveTDEE || adaptiveTDEE.insufficientData) return;
    const weightKeys = Object.keys(prog.dailyWeightLogs).sort();
    const latestWeight = weightKeys.length > 0 ? prog.dailyWeightLogs[weightKeys[weightKeys.length - 1]] : config.currentWeight;
    const newMacros = macrosFromMaintenance(adaptiveTDEE.impliedTDEE, latestWeight, config.goal, config.dietStyle || "standard");
    const intraWorkoutMacros = config.intraWorkout || null;
    const remaining = intraWorkoutMacros
      ? { p: newMacros.p - intraWorkoutMacros.p, c: newMacros.c - intraWorkoutMacros.c, f: newMacros.f - intraWorkoutMacros.f }
      : { p: newMacros.p, c: newMacros.c, f: newMacros.f };
    const perMeal = { p: remaining.p / 4, c: remaining.c / 4, f: remaining.f / 4 };
    const newSlots = config.slots.map(function (slot) {
      return Object.assign({}, slot, { p: Math.round(perMeal.p), c: Math.round(perMeal.c), f: Math.round(perMeal.f) });
    });
    save(Object.assign({}, data, { customProgramConfig: Object.assign({}, config, { macros: newMacros, slots: newSlots, currentWeight: latestWeight }) }));
    showToast("Target updated to " + newMacros.cal + " cal — regenerate your meals from each meal card's Replace Food Item section to match.");

  // Lightweight settings edit — updates just the inputs that can change on their own (current

  // did (computeCustomMacros, unchanged Mifflin-St Jeor math), without touching any logged history.
  // Deliberately does not cover goal type, training days, or equipment — those are entangled with
  // the actual exercise program structure, not just the macro math, so they still need a full reset.
  function updateProgramSettings(newWeight, newActivity, newDietStyle) {
    const config = data.customProgramConfig;

    if (!config.gender || !config.heightCm) {

      return;

    const intraWorkoutMacros = config.intraWorkout || null;
    const remaining = intraWorkoutMacros
      ? { p: newMacros.p - intraWorkoutMacros.p, c: newMacros.c - intraWorkoutMacros.c, f: newMacros.f - intraWorkoutMacros.f }
      : { p: newMacros.p, c: newMacros.c, f: newMacros.f };

    });

        macros: newMacros, slots: newSlots, currentWeight: newWeight, activity: newActivity, dietStyle: newDietStyle,
      }),
    }));

  // Toggles RIR mode for whichever program is currently active — routes to the same shared-vs-
  // per-program storage exerciseState itself already uses, since the two are fundamentally tied

  //
  // Turning OFF is immediate — it doesn't corrupt anything by itself. Turning ON queues until the

  function customCompositionChange(nextConfig, summary) {

  // `pick` is a pool name, or — for equipment the pool has never heard of — an object
  // { custom: true, name, muscle, mechanic } where mechanic is "compound", "isolation", or
  // "bodyweight". Those are the two facts the system cannot infer without a pool match: the
  // band derives from mechanic, and insights group by muscle. A custom bodyweight movement is
  // unbanded to-failure like every other; it has no bwPct, so at the 30-rep ceiling the ladder
  // step finds no rung and it holds honestly — load or a set remain the levers.
  function addCustomExercise(dayKey, pick, startWeight) {
    const isCustom = pick && typeof pick === "object" && pick.custom;
    const pool = isCustom
      ? { name: String(pick.name || "").trim(), muscle: pick.muscle,
          mechanic: pick.mechanic === "bodyweight" ? "compound" : pick.mechanic,
          bodyweight: pick.mechanic === "bodyweight", isFailure: pick.mechanic === "bodyweight",
          weight: null, bwPct: null, unilateral: false }
      : EXERCISE_POOL.filter(function (p) { return p.name === pick; })[0];
