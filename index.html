  // Defaults to the fixed range — RIR mode assumes some comfort reading your own effort level from
  // week to week, which a first-time setup can't know yet. Switching later from Settings is easy
  // and always safe (it waits for the next deload), so nothing is lost by starting simple.
  const [trainingStyle, setTrainingStyle] = useState("fixed");
  const [trainingDays, setTrainingDays] = useState([]);
  const [cardioDays, setCardioDays] = useState([]);
  const [equipmentAvailable, setEquipmentAvailable] = useState(["bodyweight"]);
  const [likedFoodsByMealCustom, setLikedFoodsByMealCustom] = useState({ m1: [], m2: [], m3: [], m4: [] });
  const [expandedMeals, setExpandedMeals] = useState({}); // absent/false = collapsed; each meal's food section starts closed
  const [foodFilters, setFoodFilters] = useState({}); // per-meal search text, keyed by mealKey
  const [plan, setPlan] = useState(null);
  const [computed, setComputed] = useState(null);

  function toggleLiked(mealKey, name) {
    setLikedFoodsByMealCustom(function (cur) {
      const list = cur[mealKey] || [];
      const next = list.indexOf(name) !== -1 ? list.filter(function (n) { return n !== name; }) : list.concat([name]);
      return Object.assign({}, cur, { [mealKey]: next });
    });
  }
  // Copies one meal's liked foods into every OTHER meal slot that's still completely empty — saves
  // re-picking the same foods 3 more times when someone eats similarly across meals, without
  // clobbering a different meal you've already deliberately customized.
  function copyLikedToEmptyMeals(sourceMealKey) {
    setLikedFoodsByMealCustom(function (cur) {
      const sourceList = cur[sourceMealKey] || [];
      if (sourceList.length === 0) return cur;
      const next = Object.assign({}, cur);
      // Derived from the chosen meal count, not a hardcoded m1–m4 — that skipped Meal 5 entirely
      // once meals-per-day became configurable. Union with existing keys so nothing already
      // present is missed regardless of how the count has changed.
      const keys = {};
      for (let i = 1; i <= mealsPerDay; i++) keys["m" + i] = true;
      Object.keys(cur).forEach(function (k) { keys[k] = true; });
      Object.keys(keys).forEach(function (k) {
        if (k !== sourceMealKey && (!cur[k] || cur[k].length === 0)) next[k] = sourceList.slice();
      });
      return next;
    });
  }
  function toggleDay(list, setList, day, maxCount) {
    setList(function (cur) {
      if (cur.indexOf(day) !== -1) return cur.filter(function (d) { return d !== day; });
      if (maxCount && cur.length >= maxCount) return cur; // ignore extra picks past what this tier needs
      return cur.concat([day]);

    });
  }

  function goToFoods() {
    const cw = Number(currentWeight);
    if (!cw) { window.alert("Enter your current weight."); return; }
    if (!gender) { window.alert("Select male or female — needed for an accurate calorie estimate."); return; }
    const feet = Number(heightFeet) || 0, inches = Number(heightInches) || 0;
    if (!feet && !inches) { window.alert("Enter your height."); return; }
    const ageNum = Number(age);
    if (!ageNum) { window.alert("Enter your age — needed for an accurate calorie estimate, not just the heart rate guideline."); return; }
    if (eatingEnd <= eatingStart) { window.alert("Eating window end time must be after the start time."); return; }
    const daysNeeded = EXPERIENCE_DAY_COUNT[experience];
    if (trainingDays.length !== daysNeeded) {
      window.alert("Pick exactly " + daysNeeded + " training day" + (daysNeeded > 1 ? "s" : "") + " for the " + experience + " program.");
      return;
    }
    let tw = cw, cbf = null, tbf = null;

      computed.usedBFMethod && h("p", { style: { color: "#a3a3a3", margin: "8px 0 0" } },
        "Body fat: " + computed.currentBF + "% → " + computed.targetBF + "%")
    ),
    h("div", { className: "panel", style: { marginBottom: 16 } },
      h("h3", null, "Training Style"),
      h("p", { style: { color: "#a3a3a3", margin: 0 } }, rules.sets + " sets × " + rules.repLow + "–" + rules.repHigh + " reps across your program, matched to a " + goal + " goal"),
      trainingStyle === "rir" && h("p", { style: { fontSize: 12, color: "#3d97d3", margin: "8px 0 0" } },
        "RIR Mode is on — starting week 1, your actual rep target will build week to week from what you log, rather than staying fixed at this range.")
    ),
    h("div", { className: "food-cat-title" }, "Generated Meals"),
    plan.results.map(function (r, i) {
      return h("div", { key: i, className: "plan-result-card" },
        h("h4", null, r.slot),
        r.items.map(function (it, j) { return h("div", { key: j, className: "plan-item-row" }, formatMealItem(it, props.allFoods)); }),
        h("div", { className: "plan-macro-row" }, Math.round(r.cal) + " cal · " + Math.round(r.p) + "p / " + Math.round(r.c) + "c / " + Math.round(r.f) + "f")
      );
    }),
    // Note sits ABOVE the button row, not inside it. As a third flex item between the two buttons
    // it squeezed "Confirm & Start My Program" into a narrow column that wrapped onto four lines.
    h("p", { style: { fontSize: 11, color: "#737373", margin: "16px 0 8px" } },
      "Starting weights are estimates from the exercise database \u2014 treat week 1 as calibration and adjust them freely; the program learns from what you actually log."),
    h("div", { style: { display: "flex", gap: 8, alignItems: "stretch" } },
      h("button", { className: "ex-action-btn", style: { flex: "0 0 auto", padding: "8px 20px" }, onClick: function () { setStep("foods"); } }, "Back"),
      h("button", { className: "generate-btn", style: { flex: 1, marginTop: 0 }, onClick: confirm }, "Confirm & Start My Program")
    )
  );
}

// ---- Auth gate ----
// Replaces the old shared-passphrase gate, which was never real security: the passphrase sat in
// this file's source in plain text, was checked entirely client-side, and was identical for every
// participant, so it could neither keep anyone out nor tell one person from another. Access control
// now rests on an actual Supabase identity, enforced server-side by the same Row-Level Security
// policies that were adversarially tested with two accounts before this file was wired up.
//
// This gate is about IDENTITY, not secrecy — the app needs to know whose data to load before it can
// render anything meaningful, which is why it wraps App rather than sitting inside it.
const LEGACY_ACCESS_STORAGE_KEY = "itl_access_unlocked_v1";

// ---- Consent ----
// Bump this string whenever the text below changes in a way people should re-agree to. Everyone is
// then re-prompted on their next load, and `consents` records which version each person accepted —
// which a boolean could never tell you once the document has been revised.
const CONSENT_VERSION = "2026-07-25";

// The consent text lives here rather than in the database on purpose: it ships with the build, so
// the version constant and the words it refers to can never drift apart. A row in `consents` saying
// "agreed to 2026-07-25" is only meaningful if 2026-07-25 unambiguously identifies one piece of text.
const CONSENT_SECTIONS = [
  { h: "A. Medical & Health Disclaimer", p: [
    "This app provides workout tracking, exercise routines, and health metrics for general informational and educational purposes only. It does not constitute medical advice, diagnosis, or treatment.",
    "Before beginning any physical activity or routine, you should consult a physician or qualified healthcare provider. Physical exercise carries inherent risks of injury, and you voluntarily assume those risks. If you experience pain, dizziness, or shortness of breath, stop immediately and seek medical attention.",
  ] },
  { h: "What we collect", p: [
    "Body measurements — weight and body fat percentage, including readings sent automatically by a Withings scale if you connect one.",
    "Training records — exercises, weight and repetitions per set, your difficulty ratings, and which sessions you completed or skipped.",
    "Nutrition records — meals and foods you log, portion sizes, and water intake.",
    "Other entries — sleep you record, and supplements you mark as taken.",
    "Progress photographs — only if you choose to upload them. Never required.",
    "We do not collect heart rate, location, contacts, or anything from other apps on your device.",
  ] },
  { h: "Where it is stored", p: [
    "On the device you use, and in a cloud database (Supabase) tied to your account. Reminder settings and your Withings connection are held by our notification service (Cloudflare).",
    "Your account's data is separated from every other account's at the database level. Other participants cannot see your information, and you cannot see theirs.",
  ] },
  { h: "What we do with it", p: [
    "We use it to build and adjust your program, calculate your targets, show your progress, and send reminders you have switched on.",
    "We do not sell your information. We do not share it with advertisers. We do not use it to train machine learning models.",
  ] },
  { h: "Sharing with a coach", p: [
    "This is the most significant sharing this app does, and it only happens if you agree to it. A coach can invite you; you must accept before anything is shared. You can have only one coach at a time.",
    "Once you accept, that coach can see your email address, program, current week, sessions logged, most recent weigh-in, when you last used the app, and your training history and meal plans in detail. They can also prescribe changes to your meal plan and training program — changes take effect from a future week, not the day they are made, and you will be told when one is applied.",
    "Your coach cannot edit your logged history: the record of what you actually did and ate stays yours. They cannot see any other participant's information, and cannot sign in as you.",
    "You can end this at any time, in the app, without asking your coach and without giving a reason. Their access stops immediately, and nothing of yours is deleted.",
  ] },
  { h: "Withdrawing your consent", p: [
    "Go to Settings \u2192 Privacy & Health Data. From there you can see what is recorded and who has access, revoke your coach's access immediately, and delete the copy of your data stored in your account.",
    "Deleting cloud data cannot be undone. Data on your own device is separate and can be cleared under Settings \u2192 Data & backup.",
    "To close your account entirely, email itlfitnessapp@gmail.com. You may withdraw from the study at any point, for any reason, without penalty.",
  ] },
];

// Sits between signing in and using the app: no health data is recorded before someone has agreed.
//
// Fails CLOSED on error rather than assuming consent — but says so, with a retry, instead of
// silently locking someone out of an app they've already agreed to use.
function ConsentGate(props) {
  const [state, setState] = useState("checking"); // checking | needed | error | ok
  const [saving, setSaving] = useState(false);
  const [scrolledToEnd, setScrolledToEnd] = useState(false);
  const scrollRef = useRef(null);

  // Two ways the "scroll to the end" gate can strand someone, both of which it did:
  //
  //   1. The outer container was minHeight:100vh, so it grew past the viewport and the PAGE
  //      scrolled rather than the inner div. The div's onScroll never fired, so reaching the bottom
  //      did nothing. Fixed by pinning the outer height and letting only the middle pane scroll.
  //   2. On a tall screen the text may not overflow at all — no scroll is possible, so no scroll
  //      event can ever arrive, and the button stays disabled forever with no way forward.
  //
  // So: enable immediately when there's nothing to scroll, and listen in the capture phase at the
  // window level, which catches scrolls from any element regardless of which one is actually moving.
  function checkAtEnd() {
    const el = scrollRef.current;
    if (!el) return;
    if (el.scrollHeight <= el.clientHeight + 4) { setScrolledToEnd(true); return; }
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 48) setScrolledToEnd(true);
  }
  useEffect(function () {
    if (state !== "needed") return;
    checkAtEnd();
    window.addEventListener("scroll", checkAtEnd, true);
    window.addEventListener("resize", checkAtEnd);
    return function () {
      window.removeEventListener("scroll", checkAtEnd, true);
      window.removeEventListener("resize", checkAtEnd);
    };
  }, [state]);

  function check() {
    setState("checking");
    supabaseClient.from("consents").select("consent_version")
      .eq("user_id", props.userId).eq("consent_version", CONSENT_VERSION).limit(1)
      .then(function (r) {
        if (r.error) { setState("error"); return; }
        setState((r.data || []).length > 0 ? "ok" : "needed");
      });
  }
  useEffect(check, [props.userId]);

  function agree() {
    setSaving(true);
    supabaseClient.from("consents").insert({
      user_id: props.userId, consent_version: CONSENT_VERSION,
      user_agent: (typeof navigator !== "undefined" ? navigator.userAgent : "").slice(0, 300),
    }).then(function (r) {
      setSaving(false);
      // A duplicate means they already agreed on another device — not an error worth showing.
      if (r.error && r.error.code !== "23505") { setState("error"); return; }
      setState("ok");
    });
  }

  if (state === "ok") return props.children;

  const shell = function (inner) {
    return h("div", { style: { minHeight: "100vh", background: "#0a0a0a", color: "#f5f5f5", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "inherit" } }, inner);
  };
  if (state === "checking") return shell(h("div", { style: { color: "#737373", fontSize: 13 } }, "Loading\u2026"));
  if (state === "error") return shell(h("div", { style: { maxWidth: 320, textAlign: "center" } },
    h("p", { style: { fontSize: 13, color: "#d4d4d4", lineHeight: 1.6 } },
      "We couldn't check your consent status. This needs a connection \u2014 the app can't record health data until it's confirmed."),
    h("button", { className: "ex-action-btn", style: { marginTop: 12, background: "#1d4ed8", color: "#fff", borderColor: "#1d4ed8" }, onClick: check }, "Try again")
  ));

  return h("div", { style: { height: "100vh", maxHeight: "100vh", background: "#0a0a0a", color: "#f5f5f5", display: "flex", flexDirection: "column", fontFamily: "inherit", overflow: "hidden" } },
    h("div", { style: { padding: "20px 20px 12px", borderBottom: "1px solid #262626", flexShrink: 0 } },
      h("img", { src: LOGO_HEADER_URI, alt: "ITL Fitness App", style: { height: 32, marginBottom: 12 } }),
      h("h2", { style: { margin: 0, fontSize: 17 } }, "Before you start"),
      h("p", { style: { fontSize: 12, color: "#a3a3a3", margin: "6px 0 0", lineHeight: 1.5 } },
        "Please read this. It explains what the app records, who can see it, and how to stop at any time.")
    ),
    // Scrolling to the end is required before the button enables. Not a legal device — it just
    // means nobody agrees to a wall of text they haven't seen the bottom of.
    h("div", {
      ref: scrollRef,
      onScroll: checkAtEnd,
      style: { flex: 1, minHeight: 0, overflowY: "auto", padding: "16px 20px", WebkitOverflowScrolling: "touch" },
    },
      CONSENT_SECTIONS.map(function (s, i) {
        return h("div", { key: i, style: { marginBottom: 18 } },
          h("div", { style: { fontSize: 13, fontWeight: 600, marginBottom: 6, color: "#f5f5f5" } }, s.h),
          s.p.map(function (t, j) {
            return h("p", { key: j, style: { fontSize: 12, color: "#a3a3a3", lineHeight: 1.65, margin: "0 0 8px" } }, t);
          })
        );
      }),
      h("p", { style: { fontSize: 11, color: "#525252", marginTop: 4 } }, "Version " + CONSENT_VERSION)
    ),
    h("div", { style: { padding: "14px 20px 20px", borderTop: "1px solid #262626", flexShrink: 0 } },
      !scrolledToEnd && h("p", { style: { fontSize: 11, color: "#737373", margin: "0 0 8px", textAlign: "center" } },
        "Scroll to the end to continue"),
      h("button", {
        className: "ex-action-btn", disabled: !scrolledToEnd || saving,
        style: { width: "100%", padding: "12px 0", background: scrolledToEnd ? "#1d4ed8" : "#1f1f1f", color: scrolledToEnd ? "#fff" : "#525252", borderColor: scrolledToEnd ? "#1d4ed8" : "#333" },
        onClick: agree,
      }, saving ? "\u2026" : "I agree"),
      h("button", {
        className: "ex-action-btn", style: { width: "100%", marginTop: 8, fontSize: 12 },
        onClick: props.onDecline,
      }, "Not now \u2014 sign out")
    )
  );
}

// ---------------------------------------------------------------------------
// APPROVAL GATE — sits between auth and consent. Public signup is open, but a fresh
// account can't touch program_states (the actual app) until approved — either by hand
// (owner sets profiles.approved = true via SQL, same mechanism as tiers) or automatically,
// the moment a coach invites them (a coaching_links row existing for this client IS the
// vetting — the coach already knows this person). Both conditions live in ONE place, the
// `is_approved()` SQL function, so the client never re-implements the rule — it just asks.
//
// Deliberately checked via RPC, not by reading profiles/coaching_links directly: an RPC
// marked security definer runs regardless of what RLS would otherwise allow the caller to
// see, so a brand new, still-unapproved account can always learn its own status. Reading
// the underlying tables directly would hit exactly the gate we're trying to render around.
function ApprovalGate(props) {
  const [state, setState] = useState("checking"); // checking | approved | pending | error
  const [signingOut, setSigningOut] = useState(false);

  function check() {
    setState("checking");
    supabaseClient.rpc("is_approved").then(function (r) {
      if (r.error) { setState("error"); return; }
      setState(r.data === true ? "approved" : "pending");
    });
  }
  useEffect(check, [props.userId]);

  if (state === "approved") return props.children;

  const shell = function (inner) {
    return h("div", { style: { minHeight: "100vh", background: "#0a0a0a", color: "#f5f5f5", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "inherit", textAlign: "center" } }, inner);
  };
  if (state === "checking") return shell(h("div", { style: { color: "#737373", fontSize: 13 } }, "Loading\u2026"));
  if (state === "error") return shell(h("div", { style: { maxWidth: 320 } },
    h("p", { style: { fontSize: 14, color: "#a3a3a3", marginBottom: 16 } }, "Couldn't check your account status. Check your connection and try again."),
    h("button", { onClick: check, style: { background: "#262626", color: "#f5f5f5", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 14 } }, "Try again")
  ));

  // pending
  return shell(h("div", { style: { maxWidth: 320 } },
    h("img", { src: LOGO_HEADER_URI, alt: "ITL Fitness App", style: { height: 40, marginBottom: 20 } }),
    h("p", { style: { fontSize: 15, color: "#f5f5f5", marginBottom: 10, fontWeight: 600 } }, "You're in — almost."),
    h("p", { style: { fontSize: 13, color: "#a3a3a3", lineHeight: 1.55, marginBottom: 20 } },
      "Your account is created. We're approving new accounts by hand right now, so hang tight " +
      "— if a coach is expecting you, this usually clears the moment they add you as a client. " +
      "You'll be in as soon as it's approved, no need to sign up again."),
    h("button", {
      onClick: check, style: { background: "#262626", color: "#f5f5f5", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 14, marginBottom: 12, width: "100%" },
    }, "Check again"),
    h("button", {
      disabled: signingOut,
      onClick: function () { setSigningOut(true); signOutEverywhereOrLocally(); },
      style: { background: "transparent", color: "#737373", border: "none", fontSize: 13, padding: "6px 0" },
    }, signingOut ? "Signing out\u2026" : "Sign out")
  ));
}

function AuthGate() {
  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);

  useEffect(function () {
    // Clear the old passphrase flag on first load after this ships. Purely housekeeping — nothing
    // reads it anymore — but leaving stale access tokens lying around in storage is a bad habit,
    // and its presence could confuse anyone debugging this later.
    try { localStorage.removeItem(LEGACY_ACCESS_STORAGE_KEY); } catch (e) {}
    supabaseClient.auth.getSession().then(function (result) {
      setSession(result.data.session);
      setAuthChecked(true);
    });
    const { data: authListener } = supabaseClient.auth.onAuthStateChange(function (event, newSession) {
      setSession(newSession);
    });
    return function () { authListener.subscription.unsubscribe(); };
  }, []);

  // Deliberately renders nothing rather than the sign-in form while the session is still being
  // resolved. Showing the form first would flash "please sign in" at someone who IS signed in on
  // every single load — worse than a brief blank, and alarming in an app holding your training
  // history.
  if (!authChecked) {
    return h("div", {
      style: {
        minHeight: "100vh", background: "#0a0a0a", color: "#737373", display: "flex",
        alignItems: "center", justifyContent: "center", fontSize: 13, fontFamily: "inherit",
      },
    }, "Loading\u2026");
  }

  if (session) {
    return h(ApprovalGate, { userId: session.user.id },
      h(ConsentGate, {
        userId: session.user.id,
        onDecline: signOutEverywhereOrLocally,
      }, h(App))
    );
  }

  return h("div", {
    style: {
      minHeight: "100vh", background: "#0a0a0a", color: "#f5f5f5", display: "flex",
      flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24,
      fontFamily: "inherit",
    },
  },
    h("img", { src: LOGO_HEADER_URI, alt: "ITL Fitness App", style: { height: 48, marginBottom: 24 } }),
    h("div", { style: { width: "100%", maxWidth: 320 } },
      h("div", { style: { fontSize: 14, color: "#a3a3a3", marginBottom: 16, textAlign: "center", lineHeight: 1.5 } },
        "Sign in to your account, or create one, to continue."),
      h(AccountAuthPanel, {
        session: null, authChecked: true,
        signUpWithEmail: function (email, password, coachRequested) { return supabaseClient.auth.signUp({ email: email, password: password, options: { data: { coach_requested: !!coachRequested } } }); },
        signInWithEmail: function (email, password) { return supabaseClient.auth.signInWithPassword({ email: email, password: password }); },
        signOut: function () { return signOutEverywhereOrLocally(); },
      }),
      h("p", { style: { fontSize: 11, color: "#525252", marginTop: 16, textAlign: "center", lineHeight: 1.5 } },
        "Your account keeps your program and logs backed up, so nothing is lost if you switch phones or clear your browser.")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(AuthGate));

// Registers the service worker for "Add to Home Screen" installability.
// Wrapped in a feature check and try/catch since this must never block the app itself —
// if registration fails (unsupported browser, sw.js missing, etc.) the app still works
// exactly as it did before, just without the install prompt.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      console.log("Service worker registration failed (app still works fine without it):", err);
    });
  });
}
</script>
</body>
</html>
